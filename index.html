<title>Hive Mind</title>

<style>
/* Layout: one portrait screen. HUD on top, the hive board fills the middle, thumb controls at the bottom.
   Single deliberate look: a hive at dusk (dark wax, amber light). */
:root {
  --bg: #1c120a;
  --panel: rgba(42, 27, 14, .86);
  --panel-2: #3a2614;
  --wax: #f3dfb5;
  --ink: #fbedd0;
  --muted: #c4a77c;
  --honey: #f5a623;
  --honey-deep: #c97a0a;
  --pollen: #57a8f0;
  --mult: #ef5f6f;
  --good: #5fcf8f;
  --danger: #ef5f6f;
  --bgA: #2b1b0c;
  --bgB: #1c120a;
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(130% 80% at 50% 38%, var(--bgA) 0%, var(--bgB) 78%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
.app {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 8px;
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- HUD ---------- */
.hud { display: grid; gap: 6px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hud-top > :first-child { min-width: 0; }
#bgfx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.where b { color: var(--ink); }
.hearts { font-size: 18px; letter-spacing: 2px; }
.hearts .lost { opacity: .22; filter: grayscale(1); }
.icon-btn { background: var(--panel); border: 1px solid #ffffff14; border-radius: 10px; width: 36px; height: 32px; font-size: 16px; }
.score-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: stretch; }
.box { background: var(--panel); border: 1px solid #ffffff10; border-radius: 12px; padding: 6px 10px; }
.score-box { position: relative; overflow: hidden; }
.score-box .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #f5a62333, #f5a62366); transition: width .35s ease; }
.score-box .inner { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--font-display); font-size: 26px; line-height: 1.05; }
.target { font-size: 13px; color: var(--muted); }
.target b { color: var(--ink); }
.stat { text-align: center; min-width: 54px; }
.stat .big { font-size: 22px; }
.moves.low .big { color: var(--danger); }
.nectar .big { color: var(--honey); }
.charms { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot {
  height: 42px; border-radius: 10px; border: 1px dashed #ffffff22; background: #00000022;
  display: grid; place-items: center; font-size: 22px; position: relative;
}
.slot.filled { border: 1px solid #f5a62355; background: var(--panel-2); }
.slot .cnt { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: 800; color: var(--honey); }
.slot.pulse { animation: pulse .5s ease; }
@keyframes pulse { 40% { transform: scale(1.15); background: #f5a62355; } }

/* ---------- Board ---------- */
.board-wrap { flex: 1; min-height: 0; position: relative; }
canvas#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tally {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; pointer-events: none;
  opacity: 0; transition: opacity .15s;
}
.tally.show { opacity: 1; }
.chip { font-family: var(--font-display); font-size: 22px; padding: 2px 12px; border-radius: 10px; min-width: 44px; text-align: center; }
.chip.p { background: var(--pollen); color: #0b2238; }
.chip.m { background: var(--mult); color: #3a0710; }
.chip.x { background: #fff3; color: var(--ink); font-size: 16px; }
.times { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.step-tag { font-weight: 800; font-size: 12px; color: var(--honey); letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; }
.banner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
  background: var(--panel); border: 2px solid var(--honey); border-radius: 14px; padding: 10px 16px;
  font-weight: 800; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: 80%;
}
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------- Controls ---------- */
.info {
  min-height: 36px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px;
  background: #00000024; border-radius: 10px; padding: 6px 10px;
}
.info b { color: var(--ink); }
.info .use { margin-left: auto; background: var(--honey); color: #2a1600; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 800; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.rot {
  height: 56px; border-radius: 14px; border: 0; background: var(--honey); color: #2a1600;
  font-size: 28px; font-weight: 800; box-shadow: 0 4px 0 var(--honey-deep);
}
.rot:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--honey-deep); }
.rot:disabled { opacity: .35; }
.seed { height: 56px; font-size: 24px; }
.seed.armed { outline: 3px solid var(--good); }

/* ---------- Screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(14, 9, 4, .8);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
.card { width: 100%; max-width: 440px; display: grid; gap: 14px; margin: auto; }
.wordmark { font-family: var(--font-display); font-size: clamp(52px, 16vw, 78px); line-height: .95; color: var(--honey); text-align: center; text-shadow: 0 5px 0 #6b3d05; }
.byline { text-align: center; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.title-hex { display: block; margin: 0 auto; width: 160px; height: 120px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; margin: 0; color: var(--honey); text-align: center; text-wrap: balance; }
h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; line-height: 1.5; }
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 17px;
  background: var(--honey); color: #2a1600; box-shadow: 0 4px 0 var(--honey-deep);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--honey-deep); }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #1a0f06; }
.btn:disabled { opacity: .4; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.toggle { background: var(--panel); border: 1px solid #ffffff1a; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.fine { font-size: 12.5px; color: var(--muted); text-align: center; }
.rounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rcard { background: var(--panel); border-radius: 12px; padding: 10px 8px; text-align: center; border: 2px solid transparent; display: grid; gap: 4px; }
.rcard.now { border-color: var(--honey); background: var(--panel-2); }
.rcard.done { opacity: .45; }
.rcard .nm { font-weight: 800; font-size: 13px; }
.rcard .tg { font-family: var(--font-display); font-size: 20px; }
.rcard .sm { font-size: 11.5px; color: var(--muted); }
.tallylist { display: grid; gap: 6px; background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.tallylist div { display: flex; justify-content: space-between; }
.tallylist .tot { border-top: 1px solid #ffffff1a; padding-top: 8px; font-weight: 800; color: var(--honey); }
.shop-head { display: flex; justify-content: space-between; align-items: center; }
.wallet { font-family: var(--font-display); font-size: 26px; color: var(--honey); }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { background: var(--panel); border: 1px solid #ffffff12; border-radius: 14px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.item .ic { font-size: 28px; }
.item .nm { font-weight: 800; }
.item .rar { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.item .rar.Rare { color: var(--pollen); } .item .rar.Legendary { color: var(--honey); } .item .rar.Uncommon { color: var(--good); }
.item .ds { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.item .buy { margin-top: 4px; border: 0; border-radius: 10px; padding: 8px; font-weight: 800; background: var(--honey); color: #2a1600; }
.item .buy:disabled { background: var(--panel-2); color: var(--muted); }
.item.sold { opacity: .4; }
.owned { display: grid; gap: 6px; }
.owned-row { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
.owned-row .sell { margin-left: auto; background: var(--panel-2); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; }
.bag { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.bag span { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.45; }
.legend { display: grid; gap: 6px; font-size: 13.5px; }
.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid #f5a62366; border-radius: 12px; padding: 8px 14px; font-weight: 600;
  z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.logo { display: block; margin: 0 auto; width: 150px; height: 150px; }
.logo-ring { transform-origin: 75px 75px; animation: spin 24s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.install { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.45; background: #00000030; border-radius: 12px; padding: 10px 12px; }
.install b { color: var(--ink); }
.tagline { text-align: center; color: var(--muted); }
.links { display: flex; justify-content: center; gap: 22px; }
.tlink { background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 14.5px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #ffffff33; padding: 6px 4px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2.left { text-align: left; }

/* field map */
.field-head { text-align: center; display: grid; gap: 2px; }
.field-head h2 { font-size: 38px; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; }
.path::before { content: ""; position: absolute; left: 23px; top: 26px; bottom: 26px; border-left: 3px dotted #ffffff38; }
.node { display: flex; gap: 12px; align-items: flex-start; position: relative; }
.node .badge { width: 48px; height: 48px; flex: none; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); background: #3a2614; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; color: var(--muted); }
.node.now .badge { background: var(--honey); color: #2a1600; }
.node.done .badge { background: var(--good); color: #0c2a18; }
.node.boss .badge { background: #5a1f27; color: var(--mult); }
.node.boss.now .badge { background: var(--mult); color: #3a0710; }
.nbody { flex: 1; min-width: 0; background: var(--panel); border-radius: 14px; padding: 10px 12px; border: 2px solid transparent; display: grid; gap: 4px; }
.node.now .nbody { border-color: var(--honey); background: rgba(58, 38, 20, .92); }
.node.done .nbody { opacity: .5; }
.node.boss .nbody { background: rgba(70, 20, 28, .55); border-color: #ef5f6f44; }
.node.boss.now .nbody { border-color: var(--mult); }
.nkind { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mult); }
.nname { font-weight: 800; font-size: 16px; }
.nrule { font-size: 13px; color: #f6c0c6; }
.nstats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.nstats b { color: var(--ink); }

/* the stall (shop) */
.screen.stall { background: rgba(20, 12, 5, .9); align-items: flex-start; }
.awning { position: relative; height: 30px; border-radius: 12px 12px 0 0; background: repeating-linear-gradient(90deg, #f5a623 0 26px, #fbedd0 26px 52px); }
.awning::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; background: radial-gradient(circle at 13px 0, #c97a0a 12px, transparent 12.5px) 0 0 / 26px 12px repeat-x; }
.stall-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-top: 10px; }
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 10px 14px; border-radius: 12px;
  background: linear-gradient(180deg, #4a2e15, #3b2410); box-shadow: inset 0 -8px 0 #2a190a, inset 0 2px 0 #6b4520; }
.ware { position: relative; background: #2a1b0e; border: 2px solid var(--rc, #c4a77c); border-radius: 14px; padding: 10px; display: grid; gap: 5px; align-content: start; box-shadow: 0 4px 0 #1a0f06; }
.ware { min-width: 0; }
.ware .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
.ware .ic { flex: none; width: 42px; height: 42px; display: grid; place-items: center; font-size: 24px; background: #00000040; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
.ware .tag { text-align: right; min-width: 0; overflow-wrap: anywhere; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--rc, #c4a77c); }
.ware .nm { font-weight: 800; line-height: 1.2; }
.ware .ds { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.ware .buy { margin-top: 4px; border: 0; border-radius: 10px; padding: 8px; font-weight: 800; background: var(--honey); color: #2a1600; }
.ware .buy:disabled { background: #3a2614; color: var(--muted); }
.ware.sold { opacity: .45; }
.ware.r-Common { --rc: #c4a77c; } .ware.r-Uncommon { --rc: #5fcf8f; } .ware.r-Rare { --rc: #57a8f0; }
.ware.r-Legendary { --rc: #f5a623; box-shadow: 0 4px 0 #1a0f06, 0 0 18px #f5a62355; }
.ware.r-Seed { --rc: #9bd36f; } .ware.r-Pack { --rc: #f5a623; }
.deal .ware { animation: deal .5s cubic-bezier(.2, .8, .25, 1.15) both; animation-delay: calc(var(--i) * 85ms); }
@keyframes deal { from { opacity: 0; transform: perspective(700px) rotateY(85deg) translateY(10px); } }
.kit { display: grid; gap: 8px; }
.kit h3 { display: flex; justify-content: space-between; }
.kit h3 span { color: var(--ink); letter-spacing: 0; }
.bag { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink); }
.bag span { display: inline-flex; align-items: center; gap: 5px; }
.sticky { position: sticky; bottom: 0; box-shadow: 0 4px 0 var(--honey-deep), 0 -10px 24px rgba(20, 12, 5, .9); }
.picks { display: grid; gap: 10px; }
.pick { display: flex; gap: 12px; align-items: center; text-align: left; background: #2a1b0e; border: 2px solid #f5a62366; border-radius: 14px; padding: 12px; }
.pick:disabled { opacity: .45; }
.pick b { display: block; font-size: 16px; }
.pick small { color: var(--muted); font-size: 13px; }

/* settings + credits */
.setting { display: grid; gap: 6px; background: var(--panel); border-radius: 12px; padding: 12px 14px; }
.setting label { font-weight: 700; }
.setting input[type=range] { width: 100%; accent-color: var(--honey); }
.credits { display: grid; gap: 10px; margin: 0; }
.credits div { background: var(--panel); border-radius: 12px; padding: 10px 14px; }
.credits dt { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.credits dd { margin: 2px 0 0; line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { .shake, .slot.pulse, .logo-ring, .deal .ware { animation: none; } }
@media (max-height: 640px) {
  .charms .slot { height: 34px; font-size: 18px; }
  .rot, .seed { height: 46px; }
  .big { font-size: 22px; }
}
</style>

<canvas id="bgfx" aria-hidden="true"></canvas>
</head>
<body>
<div class="app" id="app">
  <div class="hud">
    <div class="hud-top">
      <div class="where" id="where">Field <b>1</b> · Small patch</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="hearts" id="hearts" aria-label="Hive health"></div>
        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="score-row">
      <div class="box score-box">
        <div class="fill" id="scoreFill"></div>
        <div class="inner">
          <div><div class="lbl">Score</div><div class="big num" id="score">0</div></div>
          <div class="target">target <b class="num" id="target">0</b></div>
        </div>
      </div>
      <div class="box stat moves" id="movesBox"><div class="lbl">Moves</div><div class="big num" id="moves">20</div></div>
      <div class="box stat nectar"><div class="lbl">Nectar</div><div class="big num" id="nectar">0</div></div>
    </div>
    <div class="charms" id="charms"></div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="board" aria-label="Hive board. Tap where three cells meet, then rotate."></canvas>
    <div class="tally" id="tally">
      <span class="chip p num" id="tPollen">0</span><span class="times">×</span><span class="chip m num" id="tMult">0</span>
      <span class="chip x num" id="tX" hidden>×1.5</span><span class="step-tag" id="tStep"></span>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="info" id="info">Press where three cells meet and drag round to turn them.</div>
  <div class="controls">
    <button class="rot" id="ccw" aria-label="Rotate anticlockwise">↺</button>
    <button class="slot seed" id="seed0" aria-label="Seed slot 1"></button>
    <button class="slot seed" id="seed1" aria-label="Seed slot 2"></button>
    <button class="rot" id="cw" aria-label="Rotate clockwise">↻</button>
  </div>
</div>

<div class="screen" id="screen"><div class="card" id="screenCard"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== Honeyspin core logic (no DOM) =====
const Core = (() => {
  const R = 4;
  const SQ3 = Math.sqrt(3);
  const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  const AXES = [[1,0],[0,1],[1,-1]];

    let mult = 1 + (frost ? Math.min(step, 2) : step);

    if (fire('amber_heart', amber)) mult += 4;
    const extra = groups.reduce((n, g) => n + Math.max(0, g.keys.length - 3), 0);
    if (fire('big_family', extra > 0)) mult += extra;
    if (fire('hoarder', st.nectar >= 5)) mult += Math.floor(st.nectar / 5);
    const ob = st.charms.find(c => c.id === 'old_beekeeper'); if (ob && ob.counter) { mult += ob.counter; fired.push('old_beekeeper'); }
    let xmult = glassCount ? 1.5 : 1;   // glass counts once per clear, not per tile
    if (fire('swarm_logic', step >= 4)) xmult *= 1.5;
    if (fire('last_gasp', isLastMove)) xmult *= 2;
    fire('comb_collector', triggered.some(tr => tr.kind === 'comb'));
    if (rd.jelly) xmult *= 2;
    if (jellyBlast) { rd.jelly = true; xmult *= 2; }
    xmult = Math.round(xmult * 100) / 100;
    const score = Math.round(pollen * mult * xmult);

    rd.score += score;
    const cap = GOLD_CAP + (has(st, 'sweet_tooth') ? 2 : 0);
    gold = Math.max(0, Math.min(gold, cap - rd.goldEarned));
    if (gold) fire('sweet_tooth', true);
    st.nectar += gold + waspsCleared;   // each nest smoked out pays 1 nectar
    rd.goldEarned += gold;

    // apply
    for (const k of clear) board[k] = null;
    for (const cr of created) board[cr.key] = cr.tile;
    // royal jelly check
    for (const cell of CELLS) {
      const t = board[cell.key];
      if (t && t.kind === 'queen' && cell.nb.filter(n => board[n] && board[n].kind === 'queen').length >= 2) rd.jellyPending = true;
    }
    const moves = collapse(st);
    return { step, groups, clearedTiles, created, triggered, moves, pollen, mult, xmult, score, gold, jellyBlast, waspsCleared, fired };
  }

  // ---------- Wasps ----------
  function waspStart(st) { return 9 + (has(st, 'smoker') ? 3 : 0); }
  function spawnWasp(st) {

    if (!opts.length) return null;
    const c = pick(st.rng, opts);

  // ---------- Run ----------
  function newRun(seed) {

      colours: 5, bag: newBag(5), boss: null, bossQueue: [], board: null, round: null, shop: null,

  // RNG state lives on the run so a run can be saved and resumed exactly

// ---------- Input ----------
function toBoard(e) {

}

cv.addEventListener('pointerdown', (e) => {

// ---------- Seeds ----------
function seedTap(i) {
  if (busy || !st || !st.round) return;
  const s = st.seeds[i];
  if (!s) { info('Empty seed slot. Seeds are one-use helpers from the shop.'); return; }
  if (armedSeed === i) { armedSeed = -1; renderHUD(); defaultInfo(); return; }
  armedSeed = -1;
  info(`${s.icon} <b>${s.name}</b> · ${s.desc}`, s.target ? 'Pick a tile' : 'Use', () => {
    if (s.target) { armedSeed = i; renderHUD(); info(`${s.icon} Tap a tile to use <b>${s.name}</b>. Tap the seed again to cancel.`); }

async function useSeedAt(i, key) {

  const res = C.useSeed(st, i, key);

  if (!res) { toast('That tile can’t be used'); renderHUD(); defaultInfo(); return; }
  busy = true; sfx.coin();
  if (res.cleared) for (const cl of res.cleared) { const c = C.CELL[cl.key]; dying.push({ tile: cl.tile, x: c.x, y: c.y, t0: performance.now(), dur: dur(260) }); burstParticles(cl.key, '#fff'); }
  if (res.key) flashes.push({ key: res.key, t0: performance.now() });

// ---------- Move flow ----------
function applyFall(moves, delay) {
  const now = performance.now();
  const spawnCount = {};
  for (const m of moves) if (m.from === null) spawnCount[m.col] = (spawnCount[m.col] || 0) + 1;
  for (const m of moves) {
    const to = C.CELL[m.to];
    let fx, fy;
    if (m.from) { fx = C.CELL[m.from].x; fy = C.CELL[m.from].y; }
    else { const top = C.CELL[C.COLUMNS[m.col][0]]; fx = top.x; fy = top.y - C.SQ3 * (spawnCount[m.col] - (m.spawnRank - 1)) ; }
    const distance = Math.abs(to.y - fy);
    anims.set(m.tile.id, { fx, fy, t0: now + delay, dur: dur(170 + distance * 45), bounce: distance > 1.8 });
  }
}

async function cascade(stepStart, pivotKeys) {
  let step = stepStart, res;
  const goldCap = C.GOLD_CAP + (C.has(st, 'sweet_tooth') ? 2 : 0);
  while ((res = C.resolveStep(st, step, pivotKeys, st.round.moves === 0))) {
    const now = performance.now();
    showTally(res);
    sfx.clear(step); buzz(12);
    let glass = false;
    for (const cl of res.clearedTiles) {
      const c = C.CELL[cl.key];
      dying.push({ tile: cl.tile, x: c.x, y: c.y, t0: now, dur: dur(260) });
      burstParticles(cl.key, cl.tile.kind === 'wasp' ? '#f1c232' : (C.COLOURS[cl.tile.c] || {}).hex || '#fff', 4);
      if (cl.tile.glass) glass = true;
    }
    for (const tr of res.triggered) { if (tr.kind === 'comb') sfx.comb(); if (tr.kind === 'burst') sfx.burst(); }
    if (res.triggered.length) shakeT = now + dur(200);
    if (glass) sfx.glass();
    for (const cr of res.created) flashes.push({ key: cr.key, t0: now + dur(260) });
    const centre = res.clearedTiles.reduce((a, cl) => [a[0] + C.CELL[cl.key].x, a[1] + C.CELL[cl.key].y], [0, 0]).map(v => v / Math.max(1, res.clearedTiles.length));
    floaters.push({ x: centre[0], y: centre[1], text: '+' + fmt(res.score), t0: now });
    const nectar = res.gold + res.waspsCleared;
    if (nectar) { sfx.gold(); floaters.push({ x: centre[0], y: centre[1] + 0.9, text: `+${nectar} nectar`, c: '#ffd86b', t0: now + dur(150) }); }
    if (res.waspsCleared) { sfx.smoke(); }
    if (res.jellyBlast) { sfx.jelly(); banner('<span style="font-size:22px">Royal jelly!</span><br>×2 for the rest of the round', 1600); }
    else if (res.created.some(c => c.tile.kind === 'queen')) { sfx.queen(); banner('A queen is born'); }
    applyFall(res.moves, dur(240));
    renderHUD();
    pulseCharms(res.fired);
    if (st.round.goldEarned >= goldCap && !st.round.capToast) { st.round.capToast = true; toast(`Gold is maxed for this round (${goldCap} nectar)`); }
    st.stats.bestStep = Math.max(st.stats.bestStep, step);
    if (step >= 3) floaters.push({ x: 0, y: -C.R * 1.55, text: step >= 5 ? `Mega chain ×${step}!` : `Chain ×${step}!`, c: '#f5a623', t0: now + dur(120) });
    await wait(dur(240 + 420));
    step++; pivotKeys = [];
    if (step > 60) break;
  }
  setTimeout(() => $('tally').classList.remove('show'), 500);
  return step - stepStart;
}

async function afterSettle(countMove) {

    const ev = C.endMove(st);
    if (ev.stung.length) {
      sfx.sting(); buzz([60, 40, 60]); shakeT = performance.now() + dur(350);
      $('app').classList.remove('shake'); void $('app').offsetWidth; $('app').classList.add('shake');
      banner(ev.stung.length > 1 ? `Stung ×${ev.stung.length}!` : 'Stung! −1 hive health', 1100);
      for (const sg of ev.stung) {
        const c = C.CELL[sg.key];
        dying.push({ tile: sg.tile, x: c.x, y: c.y, t0: performance.now(), dur: dur(420) });
        flashes.push({ key: sg.key, t0: performance.now() });
        burstParticles(sg.key, '#f1c232', 8);
      }
      renderHUD();
      await wait(dur(550));
      if (st.hearts > 0) await cascade(1, []);   // the fresh tile may finish a match
    }
    if (ev.spawned) { sfx.nestAppears(); flashes.push({ key: ev.spawned, t0: performance.now() }); toast('A wasp nest appeared. Match next to it to clear it.'); }
    if (C.CELLS.some(c => { const t = st.board[c.key]; return t && t.kind === 'wasp' && t.count === 2; })) sfx.warn();
  }
  renderHUD();
  const status = C.roundStatus(st);
  if ((status === 'playing' || status === 'smoke') && !C.hasMove(st, st.board)) {
    banner('No moves left. The hive shakes!', 1200);
    await wait(dur(500));
    const mv = C.shuffleBoard(st);
    applyFall(mv.map(m => ({ tile: m.tile, from: m.from, to: m.to })), 0);
    await wait(dur(700));
  }
  const urgent = status === 'playing' && st.round.moves <= 3;
  if (urgent !== mood.urgent) setMood({ urgent }, 0.8);

  return status;
}

async function handleStatus(status) {
  const rd = st.round;
  if (status === 'smoke') {
    if (!rd.smokeShown) { rd.smokeShown = true; sfx.smoke(); banner('<span style="font-size:20px">Target reached!</span><br>Now smoke out the nests', 1800); }
    defaultInfo(); return;
  }
  if (status === 'smokeout') {
    selected = -1; busy = true;
    banner('Out of moves. The nests sting!', 1200);
    await wait(dur(600));
    for (const k of C.smokeOut(st)) {
      sfx.sting(); buzz(60); flashes.push({ key: k, t0: performance.now() }); burstParticles(k, '#f1c232', 8);
      renderHUD(); await wait(dur(380));
    }
    status = st.hearts <= 0 ? 'lost' : 'won';
  }
  if (status === 'won') { selected = -1; await wait(dur(300)); roundWon(); }
  else if (status === 'lost') { selected = -1; await wait(dur(400)); runOver(); }
  else defaultInfo();
}

  // rotation arc animation (skipped when the drag has already turned the tiles)
  if (!skipArc) for (const k of trio.keys) {
    const t = st.board[k]; if (!t) continue;
    const c = C.CELL[k];
    const a0 = Math.atan2(c.y - trio.y, c.x - trio.x);
    anims.set(t.id, { arc: { cx: trio.x, cy: trio.y, r: Math.hypot(c.x - trio.x, c.y - trio.y), a0, a1: a0 + dir * 2 * Math.PI / 3 }, t0: now, dur: dur(170) });
  }
  const r = C.doRotate(st, trioIdx, dir);
  if (r && r.free) { toast('Reverse Spin: free rotation'); pulseCharms(['reverse_spin']); }
  if (!skipArc) sfx.turn();
  renderHUD();
  if (!skipArc) await wait(dur(190));
  await cascade(1, trio.keys.slice());
  const status = await afterSettle(true);
  lastInput = performance.now();
  if (status === 'playing' || status === 'smoke') busy = false;   // stay locked until the round-end screen is up
  await handleStatus(status);
}

function showScreen(html, setup, cls = '') {
  $('screen').className = 'screen' + (cls ? ' ' + cls : '');
  $('screenCard').innerHTML = html; $('screen').hidden = false; $('screen').scrollTop = 0;
  if (setup) setup();
}
function hideScreen() { $('screen').hidden = true; }

function logoSVG(cls) {
  const hex = (x, y, r) => [0, 1, 2, 3, 4, 5].map(i => `${(x + r * Math.cos(i * Math.PI / 3)).toFixed(1)},${(y + r * Math.sin(i * Math.PI / 3)).toFixed(1)}`).join(' ');
  const cols = ['#F5A623', '#EC5F7C', '#3DC58B', '#4D9DEB', '#A57BE6', '#C2D93A'];
  const ring = cols.map((c, i) => { const a = (30 + 60 * i) * Math.PI / 180; return `<polygon points="${hex(75 + 37.2 * Math.cos(a), 75 + 37.2 * Math.sin(a), 21)}" fill="${c}" stroke="#1c120a" stroke-width="3.5"/>`; }).join('');
  return `<svg class="${cls}" viewBox="0 0 150 150" aria-hidden="true">
    <g class="logo-ring">${ring}</g>
    <polygon points="${hex(75, 75, 21)}" fill="#f3dfb5" stroke="#1c120a" stroke-width="3.5"/>
    <path d="M 66.5 79.5 A 9.5 9.5 0 1 1 79.8 83.2" fill="none" stroke="#3a2410" stroke-width="3.6" stroke-linecap="round"/>
    <polygon points="83.6,78.4 82.8,87.4 75.2,83.6" fill="#3a2410"/>
  </svg>`;
}
// Small hex swatch for tiles in the stall and the bag
function tileSVG(o, size = 40) {
  const pts = [0, 1, 2, 3, 4, 5].map(i => `${(20 + 18 * Math.cos(i * Math.PI / 3)).toFixed(1)},${(20 + 18 * Math.sin(i * Math.PI / 3)).toFixed(1)}`).join(' ');
  const col = o.kind === 'wild' ? 'url(#rb)' : (C.COLOURS[o.c] || C.COLOURS[0]).hex;
  let extra = '';
  if (o.kind === 'gold') extra = `<polygon points="${pts}" fill="none" stroke="#ffd86b" stroke-width="4"/>`;
  if (o.kind === 'glass') extra = `<path d="M6 17 L16 4 L22 4 L6 23 Z" fill="#fff" opacity=".45"/><polygon points="${pts}" fill="none" stroke="#e6f4ff" stroke-width="2.5"/>`;
  if (o.kind === 'remove') extra = '<path d="M13 13 L27 27 M27 13 L13 27" stroke="#2a1600" stroke-width="4" stroke-linecap="round"/>';
  if (o.kind === 'add') extra = '<path d="M20 11 V29 M11 20 H29" stroke="#2a1600" stroke-width="4" stroke-linecap="round"/>';
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5A623"/><stop offset=".35" stop-color="#EC5F7C"/><stop offset=".65" stop-color="#4D9DEB"/><stop offset="1" stop-color="#3DC58B"/></linearGradient></defs><polygon points="${pts}" fill="${col}" stroke="#1c120a" stroke-width="2"/>${extra}</svg>`;
}

const SAVE = 'run';
function saveRun() { if (st && !st.over) store.set(SAVE, C.serialize(st)); }
function clearSave() { try { localStorage.removeItem('hivemind.' + SAVE); } catch (e) {} }
function loadSave() { const j = store.get(SAVE, null); if (!j) return null; try { return C.restore(j); } catch (e) { return null; } }

function titleScreen() {
  st = null; $('app').style.visibility = 'hidden';
  setBiome(HIVE); setMood({ boss: null, muffled: false, urgent: false, stopped: false });
  const best = store.get('best', null), bestEndless = store.get('bestEndless', 0);
  const saved = loadSave();
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  showScreen(`
    ${logoSVG('logo')}
    <div class="wordmark">Hive Mind</div>
    <p class="tagline">Spin the comb. Match the pollen. Survive five fields.</p>
    ${saved ? `<button class="btn" id="contBtn">Continue · ${saved.endless ? 'Endless' : 'Field ' + saved.field + ' of ' + C.FIELDS}${saved.endless ? ', field ' + saved.field : ''}</button>` : ''}
    <div class="row">
      <button class="btn ${saved ? 'ghost' : ''}" id="newRun">New run</button>
      <button class="btn ghost" id="endlessBtn">Endless</button>
    </div>
    <button class="btn ghost" id="howBtn">How to play</button>
    <div class="links"><button class="tlink" id="setBtn">Settings</button><button class="tlink" id="credBtn">Credits</button></div>

    ${standalone ? '' : '<div class="install">Play full screen and offline: add Hive Mind to your home screen.<br><b>iPhone:</b> Share → Add to Home Screen · <b>Android:</b> ⋮ → Add to home screen</div>'}
    <div class="fine">v1.2</div>
  `, () => {
    if (saved) $('contBtn').onclick = () => { audio(); resumeRun(saved); };

      if (saved && btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'Tap again to start over'; return; }
      audio(); clearSave(); startRun(endless);
    };
    $('newRun').onclick = start($('newRun'), false);

}
function resumeRun(saved) {
  st = saved;
  $('app').style.visibility = 'visible';
  if (st.shop) shopScreen(false); else roundIntro();
}

function startRun(endless) {
  st = C.newRun();
  st.endless = !!endless;
  $('app').style.visibility = 'visible';
  roundIntro();
}

function roundIntro() {
  C.prepField(st);
  saveRun();
  setBiome(biomeFor(st.field));
  setMood({ boss: null, muffled: false, urgent: false, stopped: false });
  const names = C.ROUND_NAMES, fb = st.fieldBoss;
  const moves = [20, 20, 18].map(m => m + (C.has(st, 'worker_wings') ? 3 : 0));
  const reward = [3, 4, 5];
  const label = st.field > C.FIELDS ? `Endless · field ${st.field}` : `Field ${st.field} of ${C.FIELDS}`;
  showScreen(`
    <div class="field-head"><div class="eyebrow">${label}</div><h2>${C.fieldName(st.field)}</h2></div>
    <ol class="path">
      ${[0, 1, 2].map(i => `<li class="node ${i === st.roundIdx ? 'now' : i < st.roundIdx ? 'done' : ''} ${i === 2 ? 'boss' : ''}">
        <div class="badge">${i < st.roundIdx ? '✓' : i === 2 ? '!' : i + 1}</div>
        <div class="nbody">
          ${i === 2 ? `<div class="nkind">${names[2]}</div><div class="nname">${fb.name}</div><div class="nrule">${fb.rule}</div>` : `<div class="nname">${names[i]}</div>`}
          <div class="nstats num"><span>Target <b>${fmt(C.target(st, i))}</b></span><span>${moves[i]} moves</span><span>+${reward[i]} 🍯</span></div>
        </div>
      </li>`).join('')}
    </ol>
    ${st.field === 2 && st.roundIdx === 0 ? '<p class="fine">Wasp nests start appearing in this field.</p>' : ''}
    ${st.field === 3 && st.roundIdx === 0 ? '<p class="fine">A sixth colour, lime, joins the hive from this field.</p>' : ''}
    <button class="btn" id="playBtn">${st.roundIdx === 2 ? 'Face the boss' : 'Play ' + names[st.roundIdx].toLowerCase()}</button>
  `, () => { $('playBtn').onclick = () => { hideScreen(); beginRound(); }; });
}

async function beginRound() {
  anims.clear(); dying = []; particles = []; selected = -1; armedSeed = -1; drag = null; settle = null; hint = null;
  C.startRound(st);
  shownScore = 0; $('score').textContent = '0'; lastInput = performance.now();
  renderHUD();
  // drop-in animation
  const now = performance.now();
  for (const c of C.CELLS) { const t = st.board[c.key]; if (t) anims.set(t.id, { fx: c.x, fy: c.y - 9, t0: now + (c.x + 7) * 18, dur: dur(420), bounce: true, alpha0: 0 }); }
  defaultInfo();
  if (st.boss) {
    banner(`<span style="color:var(--mult);font-size:20px">${st.boss.name}</span><br>${st.boss.rule}`, 2400);
    sfx.bossIntro(st.boss.ids);
  }
  busy = true; await wait(600); busy = false;
}

function roundWon() {
  if (!st || !st.round || st.round.done) return;
  st.round.done = true;
  sfx.win(); buzz(30);
  const wasBoss = st.roundIdx === 2;
  const rd = st.round;
  const sum = C.finishRound(st);
  setMood({ boss: null, urgent: false }, 2);   // the tape speeds back up
  const best = store.get('best', { field: 0, score: 0 });
  if (!st.endless) store.set('best', { field: Math.max(best.field || 0, st.won ? C.FIELDS : st.field), score: Math.max(best.score || 0, rd.score), won: best.won || st.won });
  if (st.won) { runWon(); return; }
  const cap = C.GOLD_CAP + (C.has(st, 'sweet_tooth') ? 2 : 0);
  showScreen(`
    <h2>${wasBoss ? 'Boss beaten!' : 'Round cleared!'}</h2>
    <p style="text-align:center"><span class="num" style="font-family:var(--font-display);font-size:30px">${fmt(sum.score)}</span> <span style="color:var(--muted)">/ ${fmt(sum.target)}</span></p>
    <div class="tallylist num">
      <div><span>Round reward</span><span>+${sum.reward}</span></div>
      <div><span>Unused moves (max 5)</span><span>+${sum.unused}</span></div>
      <div><span>Interest (1 per 5 held, max 5)</span><span>+${sum.interest}</span></div>
      ${sum.gold ? `<div><span>Gold tiles (max ${cap})</span><span>+${sum.gold} banked</span></div>` : ''}
      ${wasBoss ? `<div><span>Boss beaten</span><span>+1 heart (max 3)</span></div>` : ''}
      <div class="tot"><span>Nectar</span><span>🍯 ${st.nectar}</span></div>
    </div>
    <button class="btn" id="shopBtn">Visit the stall</button>
  `, () => { $('shopBtn').onclick = () => { C.openShop(st); shopScreen(true); }; });
}

function itemCard(it, i) {
  let ic, tag, nm, ds, rar;
  if (it.type === 'charm') { ic = it.charm.icon; rar = it.charm.rarity; tag = rar; nm = it.charm.name; ds = it.charm.desc; }
  else if (it.type === 'seed') { ic = it.seed.icon; rar = 'Seed'; tag = 'Seed · one use'; nm = it.seed.name; ds = it.seed.desc; }
  else { ic = '🧺'; rar = 'Pack'; tag = 'Tile pack'; nm = it.soldOut ? 'Sold out' : 'Pick 1 of 3'; ds = it.soldOut ? 'One tile pack per visit. Restocks next round.' : 'Choose an upgrade for your tile bag. One pack per visit.'; }
  const label = it.sold ? (it.soldOut ? 'Restocks next round' : 'Bought') : it.type === 'pack' ? `Open · ${it.price} 🍯` : `Buy · ${it.price} 🍯`;
  return `<div class="ware r-${rar} ${it.sold ? 'sold' : ''}" style="--i:${i}">
    <div class="top"><span class="ic">${ic}</span><span class="tag">${tag}</span></div>
    <div class="nm">${nm}</div><div class="ds">${ds}</div>
    <button class="buy" data-i="${i}" ${it.sold || st.nectar < it.price ? 'disabled' : ''}>${label}</button>
  </div>`;
}

function shopScreen(deal) {
  saveRun();
  setMood({ muffled: true, boss: null, urgent: false });
  const sh = st.shop;
  const bagCounts = {}; let gold = 0, glass = 0, wild = 0;
  for (const b of st.bag) { bagCounts[b.c] = (bagCounts[b.c] || 0) + 1; if (b.gold) gold++; if (b.glass) glass++; if (b.wild) wild++; }
  const next = st.roundIdx === 2 ? 'Next: the boss' : 'Next round';
  showScreen(`
    <div class="awning" aria-hidden="true"></div>
    <div class="stall-head"><div><div class="eyebrow">Between rounds</div><h2 class="left">The Stall</h2></div><div class="wallet num">🍯 ${st.nectar}</div></div>
    <div class="shelf">${sh.items.map(itemCard).join('')}</div>
    <button class="btn ghost" id="rerollBtn" ${st.nectar < sh.rerollCost ? 'disabled' : ''}>Restock charms and seeds · ${sh.rerollCost} 🍯</button>
    <section class="kit">
      <h3>Your charms <span>${st.charms.length}/5</span></h3>
      <div class="owned">${st.charms.length ? st.charms.map((c, i) => `<div class="owned-row"><span style="font-size:20px">${c.icon}</span><span><b>${c.name}</b> · <span style="color:var(--muted)">${c.desc}</span></span><button class="sell" data-s="${i}">Sell ${Math.floor(c.price / 2)}</button></div>`).join('') : '<div class="fine" style="text-align:left">None yet.</div>'}</div>
      <h3>Your seeds <span>${st.seeds.length}/2</span></h3>
      <div class="owned">${st.seeds.length ? st.seeds.map(sd => `<div class="owned-row"><span style="font-size:20px">${sd.icon}</span><span><b>${sd.name}</b> · <span style="color:var(--muted)">${sd.desc}</span></span></div>`).join('') : '<div class="fine" style="text-align:left">None yet.</div>'}</div>
      <h3>Your tile bag <span>${st.bag.length}/${C.BAG_MAX}</span></h3>
      <div class="bag num">${Object.keys(bagCounts).sort().map(c => `<span>${tileSVG({ c: +c }, 20)}${bagCounts[c]}</span>`).join('')}
        ${gold ? `<span>${tileSVG({ c: 0, kind: 'gold' }, 20)}${gold} gold</span>` : ''}${glass ? `<span>${tileSVG({ c: 3, kind: 'glass' }, 20)}${glass} glass</span>` : ''}${wild ? `<span>${tileSVG({ kind: 'wild' }, 20)}${wild} wild</span>` : ''}</div>
    </section>
    <button class="btn sticky" id="nextBtn">${next}</button>
  `, () => {
    document.querySelectorAll('.buy').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, r = C.buy(st, i);
      if (r === 'choose') { sfx.click(); packPicker(i); return; }
      if (r === 'ok') { sfx.coin(); shopScreen(false); }
      else { sfx.denied(); toast(r === 'slots' ? 'No free slot. Sell one first.' : 'Not enough nectar'); }
    });
    document.querySelectorAll('.sell').forEach(b => b.onclick = () => {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; return; }
      C.sellCharm(st, +b.dataset.s); sfx.sell(); shopScreen(false);
    });
    $('rerollBtn').onclick = () => { if (C.reroll(st)) { sfx.reroll(); shopScreen(true); } };
    $('nextBtn').onclick = () => { st.shop = null; renderHUD(); roundIntro(); };
  }, 'stall' + (deal ? ' deal' : ''));
}

function packPicker(i) {
  const it = st.shop.items[i];
  showScreen(`
    <div class="awning" aria-hidden="true"></div>
    <div class="stall-head"><div><div class="eyebrow">Tile pack · ${it.price} 🍯</div><h2 class="left">Pick one</h2></div><div class="wallet num">🍯 ${st.nectar}</div></div>
    <div class="picks">
      ${it.options.map((o, oi) => {
        const ok = C.packOptionOk(st, o);
        const why = !ok ? (o.kind === 'remove' ? 'Not enough of this colour left' : `Bag is full (${C.BAG_MAX})`) : o.desc;
        return `<button class="pick" data-o="${oi}" ${ok ? '' : 'disabled'}>${tileSVG(o, 46)}<span><b>${o.title[0].toUpperCase() + o.title.slice(1)}</b><small>${why}</small></span></button>`;
      }).join('')}
    </div>
    <p class="fine">Your bag: ${st.bag.length}/${C.BAG_MAX} tiles. You only pay when you pick.</p>
    <button class="btn ghost" id="backBtn">Back to the stall</button>
  `, () => {
    document.querySelectorAll('.pick').forEach(b => b.onclick = () => {
      if (C.choosePack(st, i, +b.dataset.o) === 'ok') { sfx.coin(); shopScreen(false); } else sfx.denied();
    });
    $('backBtn').onclick = () => shopScreen(false);
  }, 'stall');
}

function runOver() {
  if (st.round) { if (st.round.done) return; st.round.done = true; }
  sfx.lose(); buzz([80, 60, 120]); clearSave();
  setMood({ stopped: true });
  const why = st.hearts <= 0 ? 'The wasps took your last heart.' : `You needed ${fmt(st.round.target)} and scored ${fmt(st.round.score)}.`;
  if (st.endless) store.set('bestEndless', Math.max(store.get('bestEndless', 0), st.field));
  else { const best = store.get('best', { field: 0, score: 0 }); store.set('best', { field: Math.max(best.field || 0, st.field), score: Math.max(best.score || 0, st.round.score), won: best.won }); }
  const where = st.endless ? `Endless, field ${st.field}` : `Field ${st.field} of ${C.FIELDS}, ${C.ROUND_NAMES[st.roundIdx].toLowerCase()}`;
  const share = `Hive Mind 🐝 ${where}. Longest chain ×${st.stats.bestStep}. ${st.charms.map(c => c.icon).join('')}`;
  showScreen(`
    <h2>Run over</h2>
    <p style="text-align:center">${why}</p>
    <div class="tallylist num">
      <div><span>Reached</span><span>${where}</span></div>
      <div><span>Rounds cleared</span><span>${st.stats.rounds}</span></div>
      <div><span>Longest cascade</span><span>${st.stats.bestStep} steps</span></div>
      <div><span>Charms</span><span>${st.charms.map(c => c.icon).join(' ') || 'none'}</span></div>
    </div>
    <button class="btn" id="againBtn">New run</button>
    <div class="row"><button class="btn ghost" id="shareBtn">Copy result</button><button class="btn ghost" id="titleBtn">Title screen</button></div>
  `, () => {
    $('againBtn').onclick = () => startRun(st.endless);
    $('titleBtn').onclick = titleScreen;
    $('shareBtn').onclick = async () => {
      try { await navigator.clipboard.writeText(share); toast('Copied. Paste it in the group chat'); }
      catch (e) { toast(share); }
    };
  });
}
function runWon() {
  sfx.runWon();
  showScreen(`
    ${logoSVG('logo')}
    <div class="wordmark" style="font-size:54px">Hive saved!</div>
    <p style="text-align:center">You beat all ${C.FIELDS} fields.</p>
    <div class="tallylist num">
      <div><span>Rounds cleared</span><span>${st.stats.rounds}</span></div>
      <div><span>Longest cascade</span><span>${st.stats.bestStep} steps</span></div>
      <div><span>Hearts left</span><span>${st.hearts}</span></div>
      <div><span>Charms</span><span>${st.charms.map(c => c.icon).join(' ')}</span></div>
    </div>
    <button class="btn" id="keepBtn">Keep going in Endless</button>
    <p class="fine">Same charms and bag. Targets grow faster and bosses come in pairs.</p>
    <button class="btn ghost" id="titleBtn">Finish the run</button>
  `, () => {
    $('keepBtn').onclick = () => { C.continueEndless(st); C.openShop(st); shopScreen(true); };
    $('titleBtn').onclick = () => { clearSave(); titleScreen(); };
  });
}
function menu() {
  if (busy) return;
  setMood({ muffled: true });
  const resume = () => { hideScreen(); setMood({ muffled: false }); };
  showScreen(`
    <h2>Paused</h2>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="setBtn">Settings</button>
    <button class="btn ghost" id="howBtn">How to play</button>
    <p class="fine">Your run is saved at the start of each round, so you can close the app and carry on later.</p>
    <button class="btn ghost" id="quitBtn">Abandon run</button>
  `, () => {
    $('resumeBtn').onclick = resume;
    $('setBtn').onclick = () => settingsScreen(menu);
    $('howBtn').onclick = () => howTo(menu);
    $('quitBtn').onclick = () => {
      $('quitBtn').textContent = 'Tap again to abandon'; $('quitBtn').onclick = () => { clearSave(); titleScreen(); };
    };
  });
}
$('menuBtn').onclick = menu;
// debug hook for testing in the browser console
window.HiveMind = {
  get state() { return st; }, get busy() { return busy; }, playMove,
  stall() { C.openShop(st); shopScreen(true); }, goField(n) { st.field = n; st.roundIdx = 0; st.fieldBossFor = 0; roundIntro(); }, give(n) { st.nectar += n; renderHUD(); },
  get audio() { return { ctx: actx && actx.state, theme: !!themeBuf, swell: !!swellBuf, clips: Object.keys(clipBuf).length, rate: musicSrc && +musicSrc.playbackRate.value.toFixed(3), lp: lpF && Math.round(lpF.frequency.value), mood: Object.assign({}, mood) }; },
};

// offline play when installed from GitHub Pages (only the packaged version links a manifest)
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

titleScreen();
})();
