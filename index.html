<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="Spin the comb, match the pollen, survive eight fields. A hex puzzle roguelike by Samderverse.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{overscroll-behavior:none}</style>
<title>Hive Mind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c120a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: one portrait screen. HUD on top, the hive board fills the middle, thumb controls at the bottom.
   Single deliberate look: a hive at dusk (dark wax, amber light). */
:root {
  --bg: #1c120a;
  --panel: #2a1b0e;
  --panel-2: #3a2614;
  --wax: #f3dfb5;
  --ink: #fbedd0;
  --muted: #c4a77c;
  --honey: #f5a623;
  --honey-deep: #c97a0a;
  --pollen: #57a8f0;
  --mult: #ef5f6f;
  --good: #5fcf8f;
  --danger: #ef5f6f;
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 45%, #2b1b0c 0%, var(--bg) 70%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
.app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 8px;
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- HUD ---------- */
.hud { display: grid; gap: 6px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.where { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.where b { color: var(--ink); }
.hearts { font-size: 18px; letter-spacing: 2px; }
.hearts .lost { opacity: .22; filter: grayscale(1); }
.icon-btn { background: var(--panel); border: 1px solid #ffffff14; border-radius: 10px; width: 36px; height: 32px; font-size: 16px; }
.score-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: stretch; }
.box { background: var(--panel); border: 1px solid #ffffff10; border-radius: 12px; padding: 6px 10px; }
.score-box { position: relative; overflow: hidden; }
.score-box .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #f5a62333, #f5a62366); transition: width .35s ease; }
.score-box .inner { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--font-display); font-size: 26px; line-height: 1.05; }
.target { font-size: 13px; color: var(--muted); }
.target b { color: var(--ink); }
.stat { text-align: center; min-width: 54px; }
.stat .big { font-size: 22px; }
.moves.low .big { color: var(--danger); }
.nectar .big { color: var(--honey); }
.charms { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot {
  height: 42px; border-radius: 10px; border: 1px dashed #ffffff22; background: #00000022;
  display: grid; place-items: center; font-size: 22px; position: relative;
}
.slot.filled { border: 1px solid #f5a62355; background: var(--panel-2); }
.slot .cnt { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: 800; color: var(--honey); }
.slot.pulse { animation: pulse .5s ease; }
@keyframes pulse { 40% { transform: scale(1.15); background: #f5a62355; } }

/* ---------- Board ---------- */
.board-wrap { flex: 1; min-height: 0; position: relative; }
canvas#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tally {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; pointer-events: none;
  opacity: 0; transition: opacity .15s;
}
.tally.show { opacity: 1; }
.chip { font-family: var(--font-display); font-size: 22px; padding: 2px 12px; border-radius: 10px; min-width: 44px; text-align: center; }
.chip.p { background: var(--pollen); color: #0b2238; }
.chip.m { background: var(--mult); color: #3a0710; }
.chip.x { background: #fff3; color: var(--ink); font-size: 16px; }
.times { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.step-tag { font-weight: 800; font-size: 12px; color: var(--honey); letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; }
.banner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
  background: var(--panel); border: 2px solid var(--honey); border-radius: 14px; padding: 10px 16px;
  font-weight: 800; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: 80%;
}
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------- Controls ---------- */
.info {
  min-height: 36px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px;
  background: #00000024; border-radius: 10px; padding: 6px 10px;
}
.info b { color: var(--ink); }
.info .use { margin-left: auto; background: var(--honey); color: #2a1600; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 800; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.rot {
  height: 56px; border-radius: 14px; border: 0; background: var(--honey); color: #2a1600;
  font-size: 28px; font-weight: 800; box-shadow: 0 4px 0 var(--honey-deep);
}
.rot:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--honey-deep); }
.rot:disabled { opacity: .35; }
.seed { height: 56px; font-size: 24px; }
.seed.armed { outline: 3px solid var(--good); }

/* ---------- Screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 20;
  background: #140c06fa;
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
.card { width: 100%; max-width: 440px; display: grid; gap: 14px; margin: auto; }
.wordmark { font-family: var(--font-display); font-size: clamp(52px, 16vw, 78px); line-height: .95; color: var(--honey); text-align: center; text-shadow: 0 5px 0 #6b3d05; }
.byline { text-align: center; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.title-hex { display: block; margin: 0 auto; width: 160px; height: 120px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; margin: 0; color: var(--honey); text-align: center; text-wrap: balance; }
h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; line-height: 1.5; }
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 17px;
  background: var(--honey); color: #2a1600; box-shadow: 0 4px 0 var(--honey-deep);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--honey-deep); }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #1a0f06; }
.btn:disabled { opacity: .4; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.toggle { background: var(--panel); border: 1px solid #ffffff1a; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.fine { font-size: 12.5px; color: var(--muted); text-align: center; }
.rounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rcard { background: var(--panel); border-radius: 12px; padding: 10px 8px; text-align: center; border: 2px solid transparent; display: grid; gap: 4px; }
.rcard.now { border-color: var(--honey); background: var(--panel-2); }
.rcard.done { opacity: .45; }
.rcard .nm { font-weight: 800; font-size: 13px; }
.rcard .tg { font-family: var(--font-display); font-size: 20px; }
.rcard .sm { font-size: 11.5px; color: var(--muted); }
.boss { background: #ef5f6f22; border: 1px solid #ef5f6f66; border-radius: 12px; padding: 10px 12px; }
.boss b { color: var(--mult); }
.tallylist { display: grid; gap: 6px; background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.tallylist div { display: flex; justify-content: space-between; }
.tallylist .tot { border-top: 1px solid #ffffff1a; padding-top: 8px; font-weight: 800; color: var(--honey); }
.shop-head { display: flex; justify-content: space-between; align-items: center; }
.wallet { font-family: var(--font-display); font-size: 26px; color: var(--honey); }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { background: var(--panel); border: 1px solid #ffffff12; border-radius: 14px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.item .ic { font-size: 28px; }
.item .nm { font-weight: 800; }
.item .rar { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.item .rar.Rare { color: var(--pollen); } .item .rar.Legendary { color: var(--honey); } .item .rar.Uncommon { color: var(--good); }
.item .ds { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.item .buy { margin-top: 4px; border: 0; border-radius: 10px; padding: 8px; font-weight: 800; background: var(--honey); color: #2a1600; }
.item .buy:disabled { background: var(--panel-2); color: var(--muted); }
.item.sold { opacity: .4; }
.owned { display: grid; gap: 6px; }
.owned-row { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
.owned-row .sell { margin-left: auto; background: var(--panel-2); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; }
.bag { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.bag span { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.45; }
.legend { display: grid; gap: 6px; font-size: 13.5px; }
.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid #f5a62366; border-radius: 12px; padding: 8px 14px; font-weight: 600;
  z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.logo { display: block; margin: 0 auto; width: 150px; height: 150px; }
.logo-ring { transform-origin: 75px 75px; animation: spin 24s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.install { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.45; background: #00000030; border-radius: 12px; padding: 10px 12px; }
.install b { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .shake, .slot.pulse, .logo-ring { animation: none; } }
@media (max-height: 640px) {
  .charms .slot { height: 34px; font-size: 18px; }
  .rot, .seed { height: 46px; }
  .big { font-size: 22px; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="hud">
    <div class="hud-top">
      <div class="where" id="where">Field <b>1</b> · Small patch</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="hearts" id="hearts" aria-label="Hive health"></div>
        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="score-row">
      <div class="box score-box">
        <div class="fill" id="scoreFill"></div>
        <div class="inner">
          <div><div class="lbl">Score</div><div class="big num" id="score">0</div></div>
          <div class="target">target <b class="num" id="target">0</b></div>
        </div>
      </div>
      <div class="box stat moves" id="movesBox"><div class="lbl">Moves</div><div class="big num" id="moves">20</div></div>
      <div class="box stat nectar"><div class="lbl">Nectar</div><div class="big num" id="nectar">0</div></div>
    </div>
    <div class="charms" id="charms"></div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="board" aria-label="Hive board. Tap where three cells meet, then rotate."></canvas>
    <div class="tally" id="tally">
      <span class="chip p num" id="tPollen">0</span><span class="times">×</span><span class="chip m num" id="tMult">0</span>
      <span class="chip x num" id="tX" hidden>×1.5</span><span class="step-tag" id="tStep"></span>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="info" id="info">Press where three cells meet and drag round to turn them.</div>
  <div class="controls">
    <button class="rot" id="ccw" aria-label="Rotate anticlockwise">↺</button>
    <button class="slot seed" id="seed0" aria-label="Seed slot 1"></button>
    <button class="slot seed" id="seed1" aria-label="Seed slot 2"></button>
    <button class="rot" id="cw" aria-label="Rotate clockwise">↻</button>
  </div>
</div>

<div class="screen" id="screen"><div class="card" id="screenCard"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== Honeyspin core logic (no DOM) =====
const Core = (() => {
  const R = 4;
  const SQ3 = Math.sqrt(3);
  const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  const AXES = [[1,0],[0,1],[1,-1]];

  const COLOURS = [
    { name: 'Amber', hex: '#F5A623' },
    { name: 'Rose', hex: '#EC5F7C' },
    { name: 'Mint', hex: '#3DC58B' },
    { name: 'Sky', hex: '#4D9DEB' },
    { name: 'Lilac', hex: '#A57BE6' },
    { name: 'Lime', hex: '#C2D93A' },
  ];

  const ROUND_NAMES = ['Small patch', 'Big patch', 'Boss bloom'];
  const ROUND_MOVES = [20, 20, 18];
  const ROUND_REWARD = [3, 4, 5];
  const TARGET_MULT = [1, 1.5, 2];
  const BASE_TARGETS = [800, 1300, 1900, 2400, 3300, 4500, 6000, 8000];
  const FIELDS = 8;

  const BOSSES = [
    { id: 'drought', name: 'The Drought', rule: 'One colour scores no pollen' },
    { id: 'gale', name: 'The Gale', rule: 'Rotations only turn clockwise' },
    { id: 'hornet', name: 'The Hornet', rule: 'Two extra wasp nests from the start' },
    { id: 'frost', name: 'The Frost', rule: 'Cascade mult stops growing after step 2' },
    { id: 'thief', name: 'The Thief', rule: 'Every move costs 1 nectar' },
  ];

  const CHARMS = [
    { id: 'busy_bee', name: 'Busy Bee', icon: '🐝', rarity: 'Common', price: 4, desc: '+2 mult for every cascade step after the first' },
    { id: 'amber_heart', name: 'Amber Heart', icon: '🧡', rarity: 'Common', price: 4, desc: '+4 mult when amber tiles clear' },
    { id: 'worker_wings', name: 'Worker Wings', icon: '🪽', rarity: 'Common', price: 5, desc: '+3 moves every round' },
    { id: 'sweet_tooth', name: 'Sweet Tooth', icon: '🍯', rarity: 'Common', price: 4, desc: 'Gold tiles give 2 nectar instead of 1' },
    { id: 'big_family', name: 'Big Family', icon: '👪', rarity: 'Common', price: 5, desc: '+1 mult for each tile over 3 in a group' },
    { id: 'smoker', name: 'Smoker', icon: '💨', rarity: 'Uncommon', price: 6, desc: 'Wasp nests start 3 moves slower' },
    { id: 'reverse_spin', name: 'Reverse Spin', icon: '🔄', rarity: 'Uncommon', price: 6, desc: 'Every 5th rotation is free' },
    { id: 'comb_collector', name: 'Comb Collector', icon: '📏', rarity: 'Uncommon', price: 6, desc: 'Combs also clear a second line' },
    { id: 'wildflower', name: 'Wildflower', icon: '🌼', rarity: 'Uncommon', price: 7, desc: '1 in 10 new tiles is wild' },
    { id: 'last_gasp', name: 'Last Gasp', icon: '😮‍💨', rarity: 'Uncommon', price: 6, desc: '×2 mult on your final move of a round' },
    { id: 'hoarder', name: 'Hoarder', icon: '🫙', rarity: 'Uncommon', price: 7, desc: '+1 mult for every 5 nectar you hold' },
    { id: 'royal_guard', name: 'Royal Guard', icon: '🛡️', rarity: 'Rare', price: 9, desc: 'Queens form from 5 matching neighbours instead of 6' },
    { id: 'swarm_logic', name: 'Swarm Logic', icon: '🧠', rarity: 'Rare', price: 9, desc: 'Cascade step 4 and beyond scores ×1.5' },
    { id: 'old_beekeeper', name: 'Old Beekeeper', icon: '👴', rarity: 'Rare', price: 10, desc: 'Gains +1 mult after every round won' },
    { id: 'golden_hive', name: 'Golden Hive', icon: '👑', rarity: 'Legendary', price: 15, desc: 'Gold tiles also count as wild' },
  ];
  const RARITY_WEIGHT = { Common: 60, Uncommon: 30, Rare: 9, Legendary: 2 };

  const SEEDS = [
    { id: 'dandelion', name: 'Dandelion', icon: '🌾', desc: 'Recolour a tile to match most of its neighbours', target: true },
    { id: 'clover', name: 'Clover', icon: '🍀', desc: '+3 moves this round', target: false },
    { id: 'thistle', name: 'Thistle', icon: '🌵', desc: 'Destroy one tile', target: true },
    { id: 'lavender', name: 'Lavender', icon: '💜', desc: 'Calm all wasps: +3 to every countdown', target: false },
    { id: 'sunflower', name: 'Sunflower', icon: '🌻', desc: 'Shuffle the board for free', target: false },
  ];

  // ---------- RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  function shuffle(rng, arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  // ---------- Geometry ----------
  const key = (q, r) => q + ',' + r;
  const CELLS = [];
  const CELL = {};
  for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) {
    if (Math.abs(q + r) > R) continue;
    const c = { q, r, key: key(q, r), x: 1.5 * q, y: SQ3 * (r + q / 2) };
    CELLS.push(c); CELL[c.key] = c;
  }
  for (const c of CELLS) {
    c.nb = DIRS.map(([dq, dr]) => CELL[key(c.q + dq, c.r + dr)]).filter(Boolean).map(n => n.key);
  }
  // columns: same q, sorted top (small y) to bottom
  const COLUMNS = {};
  for (const c of CELLS) (COLUMNS[c.q] = COLUMNS[c.q] || []).push(c.key);
  for (const q in COLUMNS) COLUMNS[q].sort((a, b) => CELL[a].y - CELL[b].y);

  const TRIOS = [];
  {
    const seen = new Set();
    for (const c of CELLS) for (let i = 0; i < 6; i++) {
      const a = DIRS[i], b = DIRS[(i + 1) % 6];
      const k1 = key(c.q + a[0], c.r + a[1]), k2 = key(c.q + b[0], c.r + b[1]);
      if (!CELL[k1] || !CELL[k2]) continue;
      const keys = [c.key, k1, k2];
      const id = [...keys].sort().join('|');
      if (seen.has(id)) continue; seen.add(id);
      const cx = (c.x + CELL[k1].x + CELL[k2].x) / 3, cy = (c.y + CELL[k1].y + CELL[k2].y) / 3;
      keys.sort((p, s) => Math.atan2(CELL[p].y - cy, CELL[p].x - cx) - Math.atan2(CELL[s].y - cy, CELL[s].x - cx));
      TRIOS.push({ keys, x: cx, y: cy });
    }
  }
  const TRIOS_BY_CELL = {};
  for (const c of CELLS) TRIOS_BY_CELL[c.key] = TRIOS.filter(t => t.keys.includes(c.key));

  // ---------- Tiles & bag ----------
  let tileId = 1;
  const makeTile = (t) => Object.assign({ id: tileId++, c: 0, kind: 'n', gold: false, glass: false, wild: false }, t);

  function newBag(colours) {
    const bag = [];
    for (let c = 0; c < colours; c++) for (let i = 0; i < 8; i++) bag.push({ c });
    return bag;
  }

  function drawTile(st) {
    const tpl = pick(st.rng, st.bag);
    const t = makeTile({ c: tpl.c, gold: !!tpl.gold, glass: !!tpl.glass, wild: !!tpl.wild });
    if (has(st, 'wildflower') && st.rng() < 0.1) t.wild = true;
    return t;
  }

  const has = (st, id) => st.charms.some(c => c.id === id);

  function isWild(st, t) {
    return t.kind === 'queen' || t.wild || (t.gold && has(st, 'golden_hive'));
  }
  const matchable = (t) => t && t.kind !== 'wasp';

  // ---------- Matching ----------
  // A set of tiles matches when they share one colour (wilds fit any) and at least one is not wild.
  function sharedColour(st, board, keys, minReal) {
    let c = -1, real = 0;
    for (const k of keys) {
      const t = board[k];
      if (!matchable(t)) return -1;
      if (isWild(st, t)) continue;
      real++;
      if (c === -1) c = t.c; else if (t.c !== c) return -1;
    }
    return real >= (minReal || 1) ? c : -1;
  }

  // Matches are triangles: three touching cells of one colour. Touching triangles of the
  // same colour merge into one group. A ring of six round any centre is a group too.
  function findGroups(st, board) {
    const tris = [];
    for (const trio of TRIOS) {
      const c = sharedColour(st, board, trio.keys);
      if (c >= 0) tris.push({ c, keys: trio.keys });
    }
    const groups = [];
    const used = new Array(tris.length).fill(false);
    for (let i = 0; i < tris.length; i++) {
      if (used[i]) continue;
      used[i] = true;
      const keys = new Set(tris[i].keys); const c = tris[i].c;
      let grew = true;
      while (grew) {
        grew = false;
        for (let j = 0; j < tris.length; j++) {
          if (used[j] || tris[j].c !== c) continue;
          if (tris[j].keys.some(k => keys.has(k))) { used[j] = true; tris[j].keys.forEach(k => keys.add(k)); grew = true; }
        }
      }
      groups.push({ c, keys: [...keys] });
    }
    const need = has(st, 'royal_guard') ? 5 : 6;
    for (const cell of CELLS) {
      if (cell.nb.length < 6) continue;
      // find a colour shared by at least `need` ring tiles
      const counts = {};
      for (const n of cell.nb) { const t = board[n]; if (matchable(t) && !isWild(st, t)) counts[t.c] = (counts[t.c] || 0) + 1; }
      const wilds = cell.nb.filter(n => matchable(board[n]) && isWild(st, board[n])).length;
      for (const c in counts) {
        if (counts[c] + wilds >= need) {
          const ring = cell.nb.filter(n => matchable(board[n]) && (isWild(st, board[n]) || board[n].c === +c));
          groups.push({ c: +c, keys: ring, ring: true, centre: cell.key });
        }
      }
    }
    return groups;
  }

  function makesMatchAt(st, board, k) {
    for (const trio of TRIOS_BY_CELL[k]) if (sharedColour(st, board, trio.keys) >= 0) return true;
    return false;
  }

  function lineAxis(groupSet, k) {
    const cell = CELL[k];
    for (let a = 0; a < 3; a++) {
      const [dq, dr] = AXES[a];
      let n = 1;
      for (const s of [1, -1]) {
        let q = cell.q + dq * s, r = cell.r + dr * s;
        while (groupSet.has(key(q, r))) { n++; q += dq * s; r += dr * s; }
      }
      if (n >= 4) return a;
    }
    return -1;
  }

  function lineCells(k, axis) {
    const c = CELL[k];
    return CELLS.filter(o => axis === 0 ? o.r === c.r : axis === 1 ? o.q === c.q : (o.q + o.r) === (c.q + c.r)).map(o => o.key);
  }

  // ---------- Rotation ----------
  function rotate(board, trio, dir) {
    const ks = trio.keys;
    const old = ks.map(k => board[k]);
    for (let i = 0; i < 3; i++) {
      const to = dir > 0 ? (i + 1) % 3 : (i + 2) % 3;
      board[ks[to]] = old[i];
    }
  }

  function hasMove(st, board) {
    for (const trio of TRIOS) {
      for (const dir of [1, -1]) {
        if (dir < 0 && st.boss && st.boss.id === 'gale') continue;
        rotate(board, trio, dir);
        const ok = findGroups(st, board).length > 0;
        rotate(board, trio, -dir);
        if (ok) return true;
      }
    }
    return false;
  }

  function fillBoard(st) {
    const board = {};
    for (let attempt = 0; attempt < 60; attempt++) {
      for (const c of CELLS) board[c.key] = null;
      for (const c of CELLS) {
        let t;
        for (let i = 0; i < 12; i++) {
          t = drawTile(st); t.wild = false;
          board[c.key] = t;
          if (findGroups(st, board).length === 0) break;
        }
      }
      if (findGroups(st, board).length === 0 && hasMove(st, board)) return board;
    }
    return board;
  }

  function shuffleBoard(st) {
    const board = st.board;
    const tiles = CELLS.map(c => board[c.key]);
    const before = {}; for (const c of CELLS) before[board[c.key].id] = c.key;
    for (let i = 0; i < 80; i++) {
      shuffle(st.rng, tiles);
      CELLS.forEach((c, j) => board[c.key] = tiles[j]);
      if (findGroups(st, board).length === 0 && hasMove(st, board)) break;
    }
    if (!hasMove(st, board)) {
      for (const c of CELLS) if (board[c.key].kind === 'n') board[c.key] = drawTile(st);
    }
    return CELLS.map(c => ({ tile: board[c.key], from: before[board[c.key].id] || null, to: c.key }));
  }

  function groupSizeAt(st, board, k0) {
    const t0 = board[k0]; if (!matchable(t0)) return 0;
    const c = t0.c; const seen = new Set([k0]); const stack = [k0];
    while (stack.length) {
      const k = stack.pop();
      for (const n of CELL[k].nb) {
        if (seen.has(n)) continue; const t = board[n];
        if (matchable(t) && (t.c === c || isWild(st, t))) { seen.add(n); stack.push(n); }
      }
    }
    return seen.size;
  }

  // ---------- Gravity ----------
  function collapse(st) {
    const board = st.board;
    const moves = [];
    for (const q in COLUMNS) {
      const col = COLUMNS[q];
      const stack = [];
      for (let i = col.length - 1; i >= 0; i--) if (board[col[i]]) stack.push({ t: board[col[i]], from: col[i] });
      let idx = 0;
      for (let i = col.length - 1; i >= 0; i--) {
        if (idx < stack.length) {
          const s = stack[idx++]; board[col[i]] = s.t;
          if (s.from !== col[i]) moves.push({ tile: s.t, from: s.from, to: col[i] });
        } else board[col[i]] = null;
      }
    }
    // refill gaps, mostly avoiding instant matches so cascades come from falling tiles
    for (const q in COLUMNS) {
      const col = COLUMNS[q];
      for (let i = col.length - 1; i >= 0; i--) {
        if (board[col[i]]) continue;
        {
          let t;
          for (let a = 0; a < 10; a++) {
            t = drawTile(st); board[col[i]] = t;
            if (isWild(st, t) || !makesMatchAt(st, board, col[i])) break;
          }
          const spawnRank = i + 1; // how far above the top it starts
          moves.push({ tile: t, from: null, spawnRank, col: q, to: col[i] });
        }
      }
    }
    return moves;
  }

  // ---------- Resolve one cascade step ----------
  function resolveStep(st, step, pivotKeys, isLastMove) {
    const board = st.board;
    const rd = st.round;
    let jellyBlast = false;
    let groups = findGroups(st, board);
    if (rd.jellyPending) { jellyBlast = true; rd.jellyPending = false; }
    if (!groups.length && !jellyBlast) return null;

    const groupSet = new Set();
    for (const g of groups) for (const k of g.keys) groupSet.add(k);

    // creations
    const created = [];
    const protectedKeys = new Set();
    const queenColour = {};
    for (const g of groups) if (g.ring && !protectedKeys.has(g.centre)) {
      protectedKeys.add(g.centre);
      created.push({ key: g.centre, tile: makeTile({ c: g.c, kind: 'queen' }) });
    }
    for (const g of groups) for (const k of g.keys) if (board[k].kind === 'queen' && queenColour[k] === undefined) queenColour[k] = g.c;
    for (const g of groups) {
      if (g.ring) continue;
      const gs = new Set(g.keys);
      if (g.keys.length < 4) continue;
      let pivot = (pivotKeys || []).find(k => gs.has(k) && !protectedKeys.has(k));
      if (!pivot) pivot = [...g.keys].filter(k => !protectedKeys.has(k)).sort((a, b) => CELL[b].y - CELL[a].y)[0];
      if (!pivot) continue;
      if (g.keys.length >= 5) {
        protectedKeys.add(pivot);
        created.push({ key: pivot, tile: makeTile({ c: g.c, kind: 'burst' }) });
      } else {
        let axis = -1;
        for (const k of g.keys) { axis = lineAxis(gs, k); if (axis >= 0) break; }
        if (axis < 0) axis = Math.floor(st.rng() * 3);
        protectedKeys.add(pivot);
        created.push({ key: pivot, tile: makeTile({ c: g.c, kind: 'comb', axis }) });
      }
    }

    // clear set + special expansion
    const clear = new Set();
    const queue = [];
    const addClear = (k) => {
      if (protectedKeys.has(k) || clear.has(k) || !board[k]) return;
      clear.add(k); queue.push(k);
    };
    if (jellyBlast) for (const c of CELLS) addClear(c.key);
    for (const k of groupSet) addClear(k);
    // wasps next to matched groups
    for (const k of groupSet) for (const n of CELL[k].nb) if (board[n] && board[n].kind === 'wasp') addClear(n);

    const triggered = [];
    while (queue.length) {
      const k = queue.shift(); const t = board[k];
      if (t.kind === 'comb') {
        triggered.push({ key: k, kind: 'comb', axis: t.axis });
        lineCells(k, t.axis).forEach(addClear);
        if (has(st, 'comb_collector')) lineCells(k, (t.axis + 1) % 3).forEach(addClear);
      } else if (t.kind === 'burst') {
        triggered.push({ key: k, kind: 'burst' });
        CELL[k].nb.forEach(addClear);
      } else if (t.kind === 'queen') {
        let c = queenColour[k];
        if (c === undefined) c = Math.floor(st.rng() * st.colours);
        triggered.push({ key: k, kind: 'queen', c });
        for (const cell of CELLS) { const o = board[cell.key]; if (o && o.kind !== 'wasp' && o.c === c) addClear(cell.key); }
      }
    }

    // scoring
    const drought = st.boss && st.boss.id === 'drought' ? st.droughtColour : -1;
    let pollen = 0, glassCount = 0, gold = 0, amber = false, waspsCleared = 0;
    const clearedTiles = [];
    for (const k of clear) {
      const t = board[k];
      clearedTiles.push({ key: k, tile: t });
      if (t.kind === 'wasp') { pollen += 25; waspsCleared++; continue; }
      if (t.c !== drought) pollen += 10;
      if (t.c === 0) amber = true;
      if (t.glass) {
        glassCount++;
        if (st.rng() < 0.25) { const i = st.bag.findIndex(b => b.glass); if (i >= 0) st.bag.splice(i, 1); }
      }
      if (t.gold) gold += has(st, 'sweet_tooth') ? 2 : 1;
    }
    for (const tr of triggered) pollen += tr.kind === 'comb' ? 30 : tr.kind === 'burst' ? 40 : 60;
    for (const cr of created) pollen += cr.tile.kind === 'queen' ? 50 : 20;

    const frost = st.boss && st.boss.id === 'frost';
    let mult = 1 + (frost ? Math.min(step, 2) : step);
    if (has(st, 'busy_bee')) mult += 2 * (step - 1);
    if (has(st, 'amber_heart') && amber) mult += 4;
    if (has(st, 'big_family')) for (const g of groups) mult += Math.max(0, g.keys.length - 3);
    if (has(st, 'hoarder')) mult += Math.floor(st.nectar / 5);
    const ob = st.charms.find(c => c.id === 'old_beekeeper'); if (ob) mult += ob.counter || 0;
    let xmult = Math.pow(1.5, glassCount);
    if (has(st, 'swarm_logic') && step >= 4) xmult *= 1.5;
    if (has(st, 'last_gasp') && isLastMove) xmult *= 2;
    if (rd.jelly) xmult *= 2;
    if (jellyBlast) { rd.jelly = true; xmult *= 2; }
    xmult = Math.round(xmult * 100) / 100;
    const score = Math.round(pollen * mult * xmult);

    rd.score += score;
    st.nectar += gold;
    rd.goldEarned += gold;

    // apply
    for (const k of clear) board[k] = null;
    for (const cr of created) board[cr.key] = cr.tile;
    // royal jelly check
    for (const cell of CELLS) {
      const t = board[cell.key];
      if (t && t.kind === 'queen' && cell.nb.filter(n => board[n] && board[n].kind === 'queen').length >= 2) rd.jellyPending = true;
    }
    const moves = collapse(st);
    return { step, groups, clearedTiles, created, triggered, moves, pollen, mult, xmult, score, gold, jellyBlast, waspsCleared };
  }

  // ---------- Wasps ----------
  function waspStart(st) { return 9 + (has(st, 'smoker') ? 3 : 0); }
  function spawnWasp(st) {
    const opts = CELLS.filter(c => st.board[c.key] && st.board[c.key].kind === 'n' && !st.board[c.key].gold);
    if (!opts.length) return null;
    const c = pick(st.rng, opts);
    const t = makeTile({ c: -1, kind: 'wasp', count: waspStart(st) });
    st.board[c.key] = t;
    return c.key;
  }
  function tickWasps(st) {
    const stung = [];
    for (const c of CELLS) {
      const t = st.board[c.key];
      if (t && t.kind === 'wasp') {
        t.count--;
        if (t.count <= 0) { stung.push(c.key); st.hearts--; t.count = waspStart(st); }
      }
    }
    return stung;
  }
  const waspCount = (st) => CELLS.filter(c => st.board[c.key] && st.board[c.key].kind === 'wasp').length;

  // ---------- Run ----------
  function newRun(seed) {
    seed = seed ?? Math.floor(Math.random() * 1e9);
    const st = {
      seed, rngState: seed, field: 1, roundIdx: 0, hearts: 3, nectar: 4, charms: [], seeds: [],
      colours: 5, bag: newBag(5), boss: null, bossQueue: [], board: null, round: null, shop: null,
      stats: { rounds: 0, bestStep: 0, bestScore: 0 }, over: false, won: false,
    };
    attachRng(st);
    return st;
  }

  // RNG state lives on the run so a run can be saved and resumed exactly
  function attachRng(st) {
    st.rng = function () {
      let a = (st.rngState | 0) + 0x6D2B79F5 | 0; st.rngState = a;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const SAVE_KEYS = ['seed', 'rngState', 'field', 'roundIdx', 'hearts', 'nectar', 'charms', 'seeds', 'colours', 'bag', 'bossQueue', 'stats', 'shop', 'droughtColour'];
  function serialize(st) { const o = { v: 1 }; for (const k of SAVE_KEYS) o[k] = st[k]; return JSON.stringify(o); }
  function restore(json) {
    const o = JSON.parse(json); if (!o || o.v !== 1) return null;
    const st = newRun(o.seed);
    for (const k of SAVE_KEYS) if (o[k] !== undefined) st[k] = o[k];
    return st;
  }

  // Best single rotation by tiles matched (used for the idle hint)
  function bestMove(st) {
    let best = null, bv = 0;
    for (let i = 0; i < TRIOS.length; i++) for (const d of [1, -1]) {
      if (d < 0 && st.boss && st.boss.id === 'gale') continue;
      rotate(st.board, TRIOS[i], d);
      const v = findGroups(st, st.board).reduce((s, g) => s + g.keys.length, 0);
      rotate(st.board, TRIOS[i], -d);
      if (v > bv) { bv = v; best = { i, d }; }
    }
    return best;
  }

  function target(st) {
    return Math.round(BASE_TARGETS[st.field - 1] * TARGET_MULT[st.roundIdx] / 10) * 10;
  }

  function startRound(st) {
    if (st.field >= 4 && st.colours < 6) {
      st.colours = 6;
      for (let i = 0; i < 8; i++) st.bag.push({ c: 5 });
    }
    st.boss = null;
    if (st.roundIdx === 2) {
      if (!st.bossQueue.length) st.bossQueue = shuffle(st.rng, BOSSES.slice());
      st.boss = st.bossQueue.pop();
      if (st.boss.id === 'drought') st.droughtColour = Math.floor(st.rng() * st.colours);
    }
    const moves = ROUND_MOVES[st.roundIdx] + (has(st, 'worker_wings') ? 3 : 0);
    st.round = { target: target(st), moves, movesMax: moves, score: 0, rotations: 0, jelly: false, jellyPending: false, goldEarned: 0, result: null };
    st.board = fillBoard(st);
    let nests = st.field >= 2 ? Math.min(3, Math.floor(st.field / 2)) : 0;
    if (st.boss && st.boss.id === 'hornet') nests += 2;
    for (let i = 0; i < nests; i++) spawnWasp(st);
    return st.round;
  }

  // Called by UI before animating: spend the move & rotate
  function doRotate(st, trioIndex, dir) {
    const rd = st.round;
    if (dir < 0 && st.boss && st.boss.id === 'gale') return false;
    rotate(st.board, TRIOS[trioIndex], dir);
    rd.rotations++;
    const free = has(st, 'reverse_spin') && rd.rotations % 5 === 0;
    if (!free) rd.moves--;
    if (st.boss && st.boss.id === 'thief') st.nectar = Math.max(0, st.nectar - 1);
    return { free };
  }

  // After all cascades of a move
  function endMove(st) {
    const stung = tickWasps(st);
    let spawned = null;
    const cap = Math.min(3, Math.floor(st.field / 2)) + (st.boss && st.boss.id === 'hornet' ? 2 : 0);
    if (st.field >= 3 && waspCount(st) < cap && st.rng() < 0.12) spawned = spawnWasp(st);
    return { stung, spawned };
  }

  function roundStatus(st) {
    const rd = st.round;
    if (st.hearts <= 0) return 'lost';
    if (rd.score >= rd.target) return 'won';
    if (rd.moves <= 0) return 'lost';
    return 'playing';
  }

  function finishRound(st) {
    const rd = st.round;
    const unused = Math.min(5, rd.moves);
    const reward = ROUND_REWARD[st.roundIdx];
    const interest = Math.min(5, Math.floor(st.nectar / 5));
    st.nectar += reward + unused + interest;
    const ob = st.charms.find(c => c.id === 'old_beekeeper'); if (ob) ob.counter = (ob.counter || 0) + 1;
    st.stats.rounds++;
    const summary = { reward, unused, interest, gold: rd.goldEarned, score: rd.score, target: rd.target };
    if (st.roundIdx === 2) st.hearts = Math.min(3, st.hearts + 1);
    const wasBossOfLast = st.roundIdx === 2 && st.field === FIELDS;
    if (wasBossOfLast) { st.won = true; st.over = true; }
    else {
      st.roundIdx++;
      if (st.roundIdx > 2) { st.roundIdx = 0; st.field++; }
    }
    return summary;
  }

  // ---------- Shop ----------
  function rollCharm(st, exclude) {
    const pool = CHARMS.filter(c => !st.charms.some(o => o.id === c.id) && !exclude.includes(c.id));
    if (!pool.length) return null;
    const total = pool.reduce((s, c) => s + RARITY_WEIGHT[c.rarity], 0);
    let x = st.rng() * total;
    for (const c of pool) { x -= RARITY_WEIGHT[c.rarity]; if (x <= 0) return c; }
    return pool[pool.length - 1];
  }
  function rollStock(st) {
    const items = [];
    const ex = [];
    for (let i = 0; i < 2; i++) {
      const c = rollCharm(st, ex);
      if (c) { ex.push(c.id); items.push({ type: 'charm', charm: c, price: c.price, sold: false }); }
    }
    const s = pick(st.rng, SEEDS);
    items.push({ type: 'seed', seed: s, price: 3, sold: false });
    const col = Math.floor(st.rng() * st.colours);
    const packs = [
      { type: 'pack', pack: 'gold', name: '3 gold tiles', icon: '✨', desc: 'Add 3 gold tiles to your bag. Each gives nectar when cleared.', price: 4 },
      { type: 'pack', pack: 'glass', name: '2 glass tiles', icon: '🔮', desc: 'Add 2 glass tiles: ×1.5 mult when cleared, may shatter.', price: 5 },
      { type: 'pack', pack: 'wild', name: '2 wild tiles', icon: '🌈', desc: 'Add 2 wild tiles that match any colour.', price: 6 },
      { type: 'pack', pack: 'remove', colour: col, name: `Remove 4 ${COLOURS[col].name.toLowerCase()}`, icon: '✂️', desc: `Take 4 ${COLOURS[col].name.toLowerCase()} tiles out of your bag so other colours come more often.`, price: 3 },
    ];
    const p = pick(st.rng, packs); p.sold = false;
    items.push(p);
    return items;
  }
  function openShop(st) { st.shop = { items: rollStock(st), rerollCost: 2 }; return st.shop; }
  function reroll(st) {
    if (st.nectar < st.shop.rerollCost) return false;
    st.nectar -= st.shop.rerollCost; st.shop.rerollCost++;
    st.shop.items = rollStock(st); return true;
  }
  function buy(st, i) {
    const it = st.shop.items[i];
    if (!it || it.sold || st.nectar < it.price) return 'nectar';
    if (it.type === 'charm') {
      if (st.charms.length >= 5) return 'slots';
      st.charms.push(Object.assign({}, it.charm, { counter: 0 }));
    } else if (it.type === 'seed') {
      if (st.seeds.length >= 2) return 'slots';
      st.seeds.push(it.seed);
    } else {
      const counts = {};
      if (it.pack === 'gold' || it.pack === 'glass' || it.pack === 'wild') {
        const n = it.pack === 'gold' ? 3 : 2;
        for (let j = 0; j < n; j++) st.bag.push({ c: Math.floor(st.rng() * st.colours), [it.pack]: true });
      } else {
        let n = 4;
        for (let j = st.bag.length - 1; j >= 0 && n > 0; j--) if (st.bag[j].c === it.colour && !st.bag[j].gold && !st.bag[j].glass) { st.bag.splice(j, 1); n--; }
      }
    }
    st.nectar -= it.price; it.sold = true;
    return 'ok';
  }
  function sellCharm(st, i) {
    const c = st.charms[i]; if (!c) return;
    st.nectar += Math.floor(c.price / 2);
    st.charms.splice(i, 1);
  }

  // ---------- Seeds ----------
  function useSeed(st, i, cellKey) {

// ---------- Input ----------
function toBoard(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - geo.ox) / geo.s, (e.clientY - r.top - geo.oy) / geo.s];
}
function nearestTrio(bx, by) {
  let best = -1, bd = 1e9;
  C.TRIOS.forEach((t, i) => { const d = (t.x - bx) ** 2 + (t.y - by) ** 2; if (d < bd) { bd = d; best = i; } });
  return bd < 1.1 ? best : -1;
}
function nearestCell(bx, by) {
  let best = null, bd = 1e9;
  for (const c of C.CELLS) { const d = (c.x - bx) ** 2 + (c.y - by) ** 2; if (d < bd) { bd = d; best = c.key; } }
  return bd < 1 ? best : null;
}
let down = null;
function canvasXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function setSelected(i) {
  if (i === selected) return;
  selected = i; selT = performance.now();
  if (i >= 0) { sfx.click(); buzz(5); }
}
function previewFor(idx, k) {
  if (!k) return new Set();
  const trio = C.TRIOS[idx], dir = k === 1 ? 1 : -1;
  C.rotate(st.board, trio, dir);
  const keys = new Set();
  for (const g of C.findGroups(st, st.board)) g.keys.forEach(x => keys.add(x));
  C.rotate(st.board, trio, -dir);
  return keys;
}
cv.addEventListener('pointerdown', (e) => {
  audio(); lastInput = performance.now(); hint = null;
  if (!st || !st.round || busy || settle || drag) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [bx, by] = toBoard(e);
  down = { x: e.clientX, y: e.clientY, b: [bx, by], id: e.pointerId };
  if (armedSeed >= 0) return;
  const t = nearestTrio(bx, by);
  if (t < 0) { setSelected(-1); defaultInfo(); return; }
  const was = selected === t;
  setSelected(t);
  const trio = C.TRIOS[t];
  const [mx, my] = canvasXY(e), [jx, jy] = px(trio.x, trio.y);
  const rad = Math.hypot(mx - jx, my - jy);
  drag = { idx: t, was, ang: 0, k: 0, last: rad > geo.s * DEAD ? Math.atan2(my - jy, mx - jx) : null, moved: false };
  previewKeys = new Set();
  defaultInfo();
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || !down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) drag.moved = true;
  const trio = C.TRIOS[drag.idx];
  const [mx, my] = canvasXY(e), [jx, jy] = px(trio.x, trio.y);
  const rad = Math.hypot(mx - jx, my - jy);
  const a = Math.atan2(my - jy, mx - jx);
  if (drag.last === null) { if (rad > geo.s * DEAD) drag.last = a; return; }
  let d = a - drag.last;
  if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
  drag.last = a;
  if (rad < geo.s * 0.7) d *= Math.max(0, rad / (geo.s * 0.7)); // calm the jitter near the pivot
  let ang = drag.ang + d;
  if (galeOn()) ang = Math.max(-0.2, Math.min(TURN + 0.5, ang));
  drag.ang = ang;
  const k = ((Math.round(ang / TURN) % 3) + 3) % 3;
  if (k !== drag.k) { drag.k = k; sfx.tick(); buzz(8); previewKeys = previewFor(drag.idx, k); }
});
function release(e, cancelled) {
  if (!down || (e && e.pointerId !== down.id)) return;
  const d0 = down; down = null;
  if (armedSeed >= 0) { if (!cancelled) { const k = nearestCell(d0.b[0], d0.b[1]); if (k) useSeedAt(armedSeed, k); } return; }
  const dr = drag; drag = null;
  if (!dr) return;
  if (!cancelled && dr.last !== null && Math.abs(dr.ang) > 0.12) {
    const n = Math.round(dr.ang / TURN);
    const k = ((n % 3) + 3) % 3;
    const t = dur(k ? 130 : 180);
    settle = { idx: dr.idx, from: dr.ang, to: n * TURN, t0: performance.now(), dur: t };
    if (!k) previewKeys = new Set();
    setTimeout(() => {
      settle = null; previewKeys = new Set();
      if (k) { sfx.lock(); buzz(14); playMove(dr.idx, k === 1 ? 1 : -1, true); }
    }, t);
    return;
  }
  if (cancelled && Math.abs(dr.ang) > 0.01) { settle = { idx: dr.idx, from: dr.ang, to: 0, t0: performance.now(), dur: dur(160) }; setTimeout(() => { settle = null; }, dur(160)); }
  previewKeys = new Set();
  if (!cancelled && !dr.moved && dr.was) rotateSel(1); // tap the same spot again: one step clockwise
}
cv.addEventListener('pointerup', (e) => release(e, false));
cv.addEventListener('pointercancel', (e) => release(e, true));
cv.addEventListener('wheel', (e) => { e.preventDefault(); if (selected >= 0) rotateSel(e.deltaY > 0 ? 1 : -1); }, { passive: false });
window.addEventListener('keydown', (e) => {
  if ($('screen').hidden === false) return;
  if (e.key === 'e' || e.key === 'E' || e.key === 'ArrowRight') rotateSel(1);
  if (e.key === 'q' || e.key === 'Q' || e.key === 'ArrowLeft') rotateSel(-1);
});
$('cw').onclick = () => rotateSel(1);
$('ccw').onclick = () => rotateSel(-1);
$('seed0').onclick = () => seedTap(0);
$('seed1').onclick = () => seedTap(1);

function rotateSel(dir) {
  if (busy || !st || !st.round) return;
  if (selected < 0) { toast('Tap where three cells meet first'); return; }
  if (dir < 0 && st.boss && st.boss.id === 'gale') { toast('The Gale: clockwise only'); return; }
  playMove(selected, dir);
}

// ---------- Seeds ----------
function seedTap(i) {
  if (busy || !st || !st.round) return;
  const s = st.seeds[i];
  if (!s) { info('Empty seed slot. Seeds are one-use helpers from the shop.'); return; }
  if (armedSeed === i) { armedSeed = -1; renderHUD(); defaultInfo(); return; }
  armedSeed = -1;
  info(`${s.icon} <b>${s.name}</b> · ${s.desc}`, s.target ? 'Pick a tile' : 'Use', () => {
    if (s.target) { armedSeed = i; renderHUD(); info(`${s.icon} Tap a tile to use <b>${s.name}</b>. Tap the seed again to cancel.`); }
    else useSeedAt(i, null);
  });
}
async function useSeedAt(i, key) {
  if (busy) return;
  const before = {};
  for (const c of C.CELLS) { const t = st.board[c.key]; if (t) before[t.id] = c.key; }
  const res = C.useSeed(st, i, key);
  armedSeed = -1;
  if (!res) { toast('That tile can’t be used'); renderHUD(); defaultInfo(); return; }
  busy = true; sfx.coin();
  if (res.cleared) for (const cl of res.cleared) { const c = C.CELL[cl.key]; dying.push({ tile: cl.tile, x: c.x, y: c.y, t0: performance.now(), dur: dur(260) }); burstParticles(cl.key, '#fff'); }
  if (res.key) flashes.push({ key: res.key, t0: performance.now() });
  if (res.moves) { applyFall(res.moves, res.id === 'sunflower' ? 0 : dur(200)); await wait(dur(520)); }
  renderHUD();
  if (res.id === 'thistle' || res.id === 'dandelion' || res.id === 'sunflower') await cascade(1, []);
  await afterSettle(false);
  busy = false; defaultInfo(); renderHUD();
}

// ---------- Move flow ----------
function applyFall(moves, delay) {
  const now = performance.now();
  const spawnCount = {};
  for (const m of moves) if (m.from === null) spawnCount[m.col] = (spawnCount[m.col] || 0) + 1;
  for (const m of moves) {
    const to = C.CELL[m.to];
    let fx, fy;
    if (m.from) { fx = C.CELL[m.from].x; fy = C.CELL[m.from].y; }
    else { const top = C.CELL[C.COLUMNS[m.col][0]]; fx = top.x; fy = top.y - C.SQ3 * (spawnCount[m.col] - (m.spawnRank - 1)) ; }
    const distance = Math.abs(to.y - fy);
    anims.set(m.tile.id, { fx, fy, t0: now + delay, dur: dur(170 + distance * 45), bounce: distance > 1.8 });
  }
}

async function cascade(stepStart, pivotKeys) {
  let step = stepStart, res;
  while ((res = C.resolveStep(st, step, pivotKeys, st.round.moves === 0))) {
    const now = performance.now();
    showTally(res);
    sfx.clear(step); buzz(12);
    for (const cl of res.clearedTiles) {
      const c = C.CELL[cl.key];
      dying.push({ tile: cl.tile, x: c.x, y: c.y, t0: now, dur: dur(260) });
      burstParticles(cl.key, cl.tile.kind === 'wasp' ? '#f1c232' : (C.COLOURS[cl.tile.c] || {}).hex || '#fff', 4);
      if (cl.tile.gold) floaters.push({ x: c.x, y: c.y, text: '+' + (C.has(st, 'sweet_tooth') ? 2 : 1), c: '#ffd86b', t0: now });
    }
    if (res.triggered.length) { sfx.special(); shakeT = now + dur(200); }
    for (const cr of res.created) flashes.push({ key: cr.key, t0: now + dur(260) });
    const centre = res.clearedTiles.reduce((a, cl) => [a[0] + C.CELL[cl.key].x, a[1] + C.CELL[cl.key].y], [0, 0]).map(v => v / Math.max(1, res.clearedTiles.length));
    floaters.push({ x: centre[0], y: centre[1], text: '+' + fmt(res.score), t0: now });
    if (res.jellyBlast) banner('<span style="font-size:22px">Royal jelly!</span><br>×2 for the rest of the round', 1600);
    else if (res.created.some(c => c.tile.kind === 'queen')) banner('A queen is born');
    applyFall(res.moves, dur(240));
    renderHUD();
    st.stats.bestStep = Math.max(st.stats.bestStep, step);
    if (step >= 3) floaters.push({ x: 0, y: -C.R * 1.55, text: step >= 5 ? `Mega chain ×${step}!` : `Chain ×${step}!`, c: '#f5a623', t0: now + dur(120) });
    await wait(dur(240 + 420));
    step++; pivotKeys = [];
    if (step > 60) break;
  }
  setTimeout(() => $('tally').classList.remove('show'), 500);
  return step - stepStart;
}

async function afterSettle(countMove) {
  if (countMove) {
    const ev = C.endMove(st);
    if (ev.stung.length) {
      sfx.sting(); buzz([60, 40, 60]); shakeT = performance.now() + dur(350);
      $('app').classList.remove('shake'); void $('app').offsetWidth; $('app').classList.add('shake');
      banner(`Stung! −1 hive health`, 1000);
      for (const k of ev.stung) flashes.push({ key: k, t0: performance.now() });
      await wait(dur(500));
    }
    if (ev.spawned) { sfx.buzz(); flashes.push({ key: ev.spawned, t0: performance.now() }); toast('A wasp nest appeared. Match next to it to clear it.'); }
  }
  renderHUD();
  const status = C.roundStatus(st);
  if (status === 'playing' && !C.hasMove(st, st.board)) {
    banner('No moves left. The hive shakes!', 1200);
    await wait(dur(500));
    const mv = C.shuffleBoard(st);
    applyFall(mv.map(m => ({ tile: m.tile, from: m.from, to: m.to })), 0);
    await wait(dur(700));
  }
  return status;
}

async function playMove(trioIdx, dir, skipArc) {
  busy = true; hint = null;
  const trio = C.TRIOS[trioIdx];
  const now = performance.now();
  // rotation arc animation (skipped when the drag has already turned the tiles)
  if (!skipArc) for (const k of trio.keys) {
    const t = st.board[k]; if (!t) continue;
    const c = C.CELL[k];
    const a0 = Math.atan2(c.y - trio.y, c.x - trio.x);
    anims.set(t.id, { arc: { cx: trio.x, cy: trio.y, r: Math.hypot(c.x - trio.x, c.y - trio.y), a0, a1: a0 + dir * 2 * Math.PI / 3 }, t0: now, dur: dur(170) });
  }
  const r = C.doRotate(st, trioIdx, dir);
  if (r && r.free) toast('Reverse Spin: free rotation');
  sfx.turn(); renderHUD();
  if (!skipArc) await wait(dur(190));
  await cascade(1, trio.keys.slice());
  const status = await afterSettle(true);
  busy = false; lastInput = performance.now();
  if (status === 'won') { selected = -1; await wait(dur(300)); roundWon(); }
  else if (status === 'lost') { selected = -1; await wait(dur(400)); runOver(); }
  else defaultInfo();
}

async function beginRound() {

  C.startRound(st);
  shownScore = 0; $('score').textContent = '0'; lastInput = performance.now();
  renderHUD();
  // drop-in animation
  const now = performance.now();
  for (const c of C.CELLS) { const t = st.board[c.key]; if (t) anims.set(t.id, { fx: c.x, fy: c.y - 9, t0: now + (c.x + 7) * 18, dur: dur(420), bounce: true, alpha0: 0 }); }

  if (st.boss) {
    let rule = st.boss.rule;
    if (st.boss.id === 'drought') rule = `${C.COLOURS[st.droughtColour].name} scores no pollen`;
    st.boss = Object.assign({}, st.boss, { rule });
    banner(`<span style="color:var(--mult);font-size:20px">${st.boss.name}</span><br>${rule}`, 2200);

function roundWon() {

  const best = store.get('best', { field: 0, score: 0 });
  store.set('best', { field: Math.max(best.field, st.won ? 8 : st.field), score: Math.max(best.score || 0, rd.score), won: best.won || st.won });
  if (st.won) { runWon(); return; }
  showScreen(`
    <h2>Round cleared!</h2>
    <p style="text-align:center"><span class="num" style="font-family:var(--font-display);font-size:30px">${fmt(sum.score)}</span> <span style="color:var(--muted)">/ ${fmt(sum.target)}</span></p>
    <div class="tallylist num">
      <div><span>Round reward</span><span>+${sum.reward}</span></div>
      <div><span>Unused moves (max 5)</span><span>+${sum.unused}</span></div>
      <div><span>Interest (1 per 5 held, max 5)</span><span>+${sum.interest}</span></div>
      ${sum.gold ? `<div><span>Gold tiles this round</span><span>+${sum.gold} (already banked)</span></div>` : ''}
      ${wasBoss ? `<div><span>Boss beaten</span><span>+1 heart (max 3)</span></div>` : ''}
      <div class="tot"><span>Nectar</span><span>🍯 ${st.nectar}</span></div>
    </div>
    <button class="btn" id="shopBtn">Visit the shop</button>
  `, () => { $('shopBtn').onclick = () => { C.openShop(st); shopScreen(); }; });
}

function shopScreen() {
  saveRun();
  const sh = st.shop;
  const bagCounts = {}; let gold = 0, glass = 0, wild = 0;
  for (const b of st.bag) { bagCounts[b.c] = (bagCounts[b.c] || 0) + 1; if (b.gold) gold++; if (b.glass) glass++; if (b.wild) wild++; }
  showScreen(`
    <div class="shop-head"><h2 style="text-align:left">The shop</h2><div class="wallet num">🍯 ${st.nectar}</div></div>
    <div class="items">
      ${sh.items.map((it, i) => {
        const nm = it.type === 'charm' ? it.charm.name : it.type === 'seed' ? it.seed.name : it.name;
        const ic = it.type === 'charm' ? it.charm.icon : it.type === 'seed' ? it.seed.icon : it.icon;
        const ds = it.type === 'charm' ? it.charm.desc : it.type === 'seed' ? it.seed.desc : it.desc;
        const rar = it.type === 'charm' ? it.charm.rarity : it.type === 'seed' ? 'Seed' : 'Bag';
        return `<div class="item ${it.sold ? 'sold' : ''}"><div class="ic">${ic}</div><div class="rar ${rar}">${rar}</div><div class="nm">${nm}</div><div class="ds">${ds}</div>
          <button class="buy" data-i="${i}" ${it.sold || st.nectar < it.price ? 'disabled' : ''}>${it.sold ? 'Bought' : 'Buy · ' + it.price + ' 🍯'}</button></div>`;
      }).join('')}
    </div>
    <div class="row"><button class="btn ghost" id="rerollBtn" ${st.nectar < sh.rerollCost ? 'disabled' : ''}>Reroll · ${sh.rerollCost} 🍯</button></div>
    <h3>Your charms (${st.charms.length}/5)</h3>
    <div class="owned">${st.charms.length ? st.charms.map((c, i) => `<div class="owned-row"><span style="font-size:20px">${c.icon}</span><span><b>${c.name}</b> · <span style="color:var(--muted)">${c.desc}</span></span><button class="sell" data-s="${i}">Sell ${Math.floor(c.price / 2)}</button></div>`).join('') : '<div class="fine" style="text-align:left">None yet.</div>'}</div>
    <h3>Your seeds (${st.seeds.length}/2)</h3>
    <div class="owned">${st.seeds.length ? st.seeds.map(s => `<div class="owned-row"><span style="font-size:20px">${s.icon}</span><span><b>${s.name}</b> · <span style="color:var(--muted)">${s.desc}</span></span></div>`).join('') : '<div class="fine" style="text-align:left">None yet.</div>'}</div>
    <h3>Your tile bag (${st.bag.length})</h3>
    <div class="bag num">${Object.keys(bagCounts).sort().map(c => `<span><span class="dot" style="background:${C.COLOURS[c].hex}"></span>${bagCounts[c]}</span>`).join('')}
      ${gold ? `<span>✨ ${gold} gold</span>` : ''}${glass ? `<span>🔮 ${glass} glass</span>` : ''}${wild ? `<span>🌈 ${wild} wild</span>` : ''}</div>
    <button class="btn" id="nextBtn">Next round</button>
  `, () => {
    document.querySelectorAll('.buy').forEach(b => b.onclick = () => {
      const r = C.buy(st, +b.dataset.i);
      if (r === 'ok') { sfx.coin(); shopScreen(); }
      else toast(r === 'slots' ? 'No free slot. Sell one first.' : 'Not enough nectar');
    });
    document.querySelectorAll('.sell').forEach(b => b.onclick = () => { C.sellCharm(st, +b.dataset.s); sfx.coin(); shopScreen(); });
    $('rerollBtn').onclick = () => { if (C.reroll(st)) { sfx.click(); shopScreen(); } };
    $('nextBtn').onclick = () => { st.shop = null; renderHUD(); roundIntro(); };
  });
}

function runOver() {
  sfx.lose(); buzz([80, 60, 120]); clearSave();
  const why = st.hearts <= 0 ? 'The wasps took your last heart.' : `You needed ${fmt(st.round.target)} and scored ${fmt(st.round.score)}.`;
  const best = store.get('best', { field: 0, score: 0 });
  store.set('best', { field: Math.max(best.field, st.field), score: Math.max(best.score || 0, st.round.score), won: best.won });
  showScreen(`
    <h2>Run over</h2>
    <p style="text-align:center">${why}</p>
    <div class="tallylist num">
      <div><span>Reached</span><span>Field ${st.field} · ${C.ROUND_NAMES[st.roundIdx]}</span></div>
      <div><span>Rounds cleared</span><span>${st.stats.rounds}</span></div>
      <div><span>Longest cascade</span><span>${st.stats.bestStep} steps</span></div>
      <div><span>Charms</span><span>${st.charms.map(c => c.icon).join(' ') || 'none'}</span></div>
    </div>
    <button class="btn" id="againBtn">New run</button>
    <button class="btn ghost" id="titleBtn">Title screen</button>
  `, () => { $('againBtn').onclick = startRun; $('titleBtn').onclick = titleScreen; });
}
function runWon() {
  clearSave();
  showScreen(`
    <div class="wordmark" style="font-size:54px">Hive saved!</div>
    <p style="text-align:center">You beat all eight fields.</p>
    <div class="tallylist num">
      <div><span>Rounds cleared</span><span>${st.stats.rounds}</span></div>
      <div><span>Longest cascade</span><span>${st.stats.bestStep} steps</span></div>
      <div><span>Hearts left</span><span>${st.hearts}</span></div>
      <div><span>Charms</span><span>${st.charms.map(c => c.icon).join(' ')}</span></div>
    </div>
    <button class="btn" id="againBtn">New run</button>
    <button class="btn ghost" id="titleBtn">Title screen</button>
  `, () => { $('againBtn').onclick = startRun; $('titleBtn').onclick = titleScreen; });
}
function menu() {
  if (busy) return;
  showScreen(`
    <h2>Paused</h2>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="howBtn">How to play</button>
    <div class="toggles">
      <button class="toggle" id="sndT">Sound: ${settings.sound ? 'on' : 'off'}</button>
      <button class="toggle" id="spdT">Speed: ${settings.speed}×</button>
    </div>
    <p class="fine">Your run is saved at the start of each round, so you can close the app and carry on later.</p>
    <button class="btn ghost" id="quitBtn">Abandon run</button>
  `, () => {
    $('resumeBtn').onclick = hideScreen;
    $('howBtn').onclick = () => howTo(menu);
    bindToggles(menu);
    $('quitBtn').onclick = () => {
      $('quitBtn').textContent = 'Tap again to abandon'; $('quitBtn').onclick = () => { clearSave(); titleScreen(); };
    };
  });
}
$('menuBtn').onclick = menu;
// debug hook for testing in the browser console
window.HiveMind = { get state() { return st; }, playMove, give(n) { st.nectar += n; renderHUD(); } };

// offline play when installed from GitHub Pages (only the packaged version links a manifest)
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

titleScreen();
})();
</script>

</body>
</html>
